name: Install jellyfin-ffmpeg 8
description: >-
  The ffmpeg the Docker image ships (jellyfin-ffmpeg8, same version, built for the runner's
  Ubuntu), so CI tests against the version users run. Ubuntu's own package is ffmpeg 6.

runs:
  using: composite
  steps:
    - name: Install jellyfin-ffmpeg from its pinned .deb
      shell: bash
      run: |
        # Keep the version in step with the Dockerfile's.
        deb=jellyfin-ffmpeg8_8.1.3-2-noble_amd64.deb
        curl -fsSL -o "$RUNNER_TEMP/$deb" "https://repo.jellyfin.org/ubuntu/pool/main/j/jellyfin-ffmpeg/$deb"
        echo "22e3bbb6ca67f4d7badb16ae4a3c677940b97cb76eb273af7d70f6cb2b9b62bf  $RUNNER_TEMP/$deb" | sha256sum --check --quiet
        sudo apt-get update -qq
        # The fake source's drawtext overlay needs a font.
        sudo apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP/$deb" fonts-dejavu-core > /dev/null
        sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
        sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
        ffmpeg -hide_banner -version | head -n 1
