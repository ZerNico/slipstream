name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc.1 for a prerelease). This builds a draft
# release with GitHub's generated notes, the image under its exact version and the
# signed APK attached. Someone then rewrites the notes and publishes it by hand, so
# nothing is announced unread; publishing runs promote.yml. A failed run leaves the
# draft to re-run.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, reusing it."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"

  # The tagged commit has normally passed CI on main already: a successful CI run pushed for
  # this exact SHA is enough, so the release goes straight to the builds. Without one (or when
  # the API cannot say), CI runs here as before.
  passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ci: ${{ steps.check.outputs.ci }}
    steps:
      - name: Has this commit passed CI?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Push runs only: a pull request's run tests its merge with the base, not this SHA.
          runs=$(gh run list --workflow ci.yml --commit "$SHA" --event push --status success \
            --json databaseId --jq length) || runs=0
          if [[ "$runs" =~ ^[0-9]+$ ]] && (( runs > 0 )); then
            echo "CI already passed for $SHA, skipping it." >> "$GITHUB_STEP_SUMMARY"
            echo "ci=passed" >> "$GITHUB_OUTPUT"
          else
            echo "No successful CI run for $SHA, running CI." >> "$GITHUB_STEP_SUMMARY"
            echo "ci=run" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: passed
    if: needs.passed.outputs.ci != 'passed'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  docker:
    needs: [draft, passed, ci]
    # A skipped `ci` would skip everything after it; it may only be skipped because it passed.
    if: >-
      !cancelled() && needs.draft.result == 'success' && needs.passed.result == 'success' &&
      (needs.ci.result == 'success' ||
      (needs.ci.result == 'skipped' && needs.passed.outputs.ci == 'passed'))
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  android:
    needs: [draft, passed, ci]
    if: >-
      !cancelled() && needs.draft.result == 'success' && needs.passed.result == 'success' &&
      (needs.ci.result == 'success' ||
      (needs.ci.result == 'skipped' && needs.passed.outputs.ci == 'passed'))
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.draft.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

  assets:
    needs: [docker, android]
    # Spelled out: the default would skip this whenever `ci` was skipped, as an ancestor.
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-apk
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" assets/* --clobber
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Draft ready: rewrite the notes and publish at $url" >> "$GITHUB_STEP_SUMMARY"
