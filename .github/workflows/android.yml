name: Android

# One release APK for phones and Android TV, uploaded as the `android-apk` artifact
# (slipstream-<version>.apk). release.yml attaches it to the release; a manual run is for
# trying a build. android/ is generated by `expo prebuild` (EXPO_TV=1 gives one app with both
# the phone and the leanback launcher entry); plugins/with-release-signing.cjs sets the version
# and reads the signing key from the environment.
#
# ABIs: arm64-v8a (phones, Nvidia Shield, current Google TV boxes), armeabi-v7a (the many TV
# sticks and boxes that run a 32-bit system, e.g. Chromecast with Google TV, older Fire TV) and
# x86_64 (emulators, x86 boxes). 32-bit x86 is left out: next to no device needs it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v. Empty uses app.json's.
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: App version without the leading v.
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCHITECTURES: arm64-v8a,armeabi-v7a,x86_64

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-$(node -p 'require("./apps/app/app.json").expo.version')}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      # The keystore goes to the runner's temp directory, which is removed after the job.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            if [[ "$RELEASE" == "true" ]]; then
              echo "::error::A release APK needs the ANDROID_KEYSTORE_BASE64 secret"
              exit 1
            fi
            echo "::warning::No signing key: the APK is signed with the debug key"
            exit 0
          fi
          base64 --decode <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Prebuild
        working-directory: apps/app
        env:
          EXPO_TV: "1"
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build
        working-directory: apps/app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ARCHITECTURES"

      - name: Check the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=apps/app/android/app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          "$tools/aapt2" dump badging "$apk" | grep -E "^package:|^native-code:" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION'"; then
            echo "::error::The APK's versionName is not $VERSION"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          mv "$apk" "$RUNNER_TEMP/apk/slipstream-$VERSION.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 7
