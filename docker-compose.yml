# Slipstream with Docker Compose.
#
#   docker compose up -d                  the server and web UI on http://localhost:8080
#   docker compose --profile demo up -d   plus the fake source, to try it without an IPTV
#                                         subscription: in the web UI add a source with the
#                                         playlist http://fake-source:8090/playlist.m3u and the
#                                         guide http://fake-source:8090/epg.xml
#   docker compose pull && docker compose up -d   update to the newest release
#
# The image is the published one; the fake source ships in it too. To build from a checkout
# instead, swap the `image:` line below for the commented `build:` lines and add `--build`.
#
# First start opens the setup wizard, which creates the admin account. Settings are SLIPSTREAM_*
# variables (docs/configuration.md). Back up the config volume: it holds the database and secret.key.
name: slipstream

x-image: &image
  # `latest` is the newest release; pin a version (e.g. `0.1.0`) to update deliberately, or use
  # `edge` for the main branch.
  image: ghcr.io/zernico/slipstream:latest
  # build: .
  # image: slipstream:local

services:
  slipstream:
    <<: *image
    ports:
      - "8080:8080"
    environment:
      # The household time zone: rule weekdays and dates in folder names are read in it.
      SLIPSTREAM_TIME_ZONE: Europe/Berlin
      # How people reach Slipstream, for links and secure cookies behind a reverse proxy:
      # SLIPSTREAM_PUBLIC_URL: https://tv.example.com
      # SLIPSTREAM_TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      # The SQLite database must be on a real disk, never a FUSE or network share.
      - config:/config
      # The segment store; recordings take 3-4 GB per channel-hour.
      - data:/data
    # Hardware encoding (docs/configuration.md#hardware-acceleration). Intel or AMD: pass the GPU
    # and add the group id that owns it on the host (`stat -c %g /dev/dri/renderD128`).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"
    # NVIDIA, with the NVIDIA Container Toolkit installed:
    # runtime: nvidia
    # and under environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    #   NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    restart: unless-stopped

  fake-source:
    <<: *image
    profiles: [demo]
    command:
      [
        "node",
        "tools/fake-source/src/bin/fake-source.ts",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--duplicates",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/playlist.m3u').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  config:
  data:
