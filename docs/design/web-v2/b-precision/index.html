<!doctype html>
<!--
  SLIPSTREAM WEB v2 · DIRECTION B · "PRECISION"

  Direction (5 sentences):
  Slipstream is a precision instrument for time: every screen answers "where am I relative to live?" with exact, tabular numbers.
  The UI is quiet, neutral and dense where density helps (guide, library, rules), so the two signal colours mean something: amber is YOU (playhead, primary action, focus), red is LIVE (now line, live edge, recording).
  Everything is reachable from the keyboard: a command palette (Cmd/Ctrl+K or /), G-then-letter navigation, J/K/L transport in the player, arrow-key roving in the guide.
  Pages share one 52 px header bar and one content grid, and loading states are the final layout with shimmer instead of text, so nothing ever jumps.
  On phones the same tool becomes thumb-first: a five-tab bar, a "What's on at…" list instead of the grid, and bottom sheets instead of drawers.

  Type: Geist (UI) + Geist Mono (all times, durations, codes, counts) from Google Fonts. Scale 11 / 12 / 13 / 14 (base) / 16 / 20 / 28 / 44 (behind-live readout).
  Weights 400/500/600 only. Tabular numerals everywhere numbers change.
  Colour: neutral greys (cool-neutral dark #0B0C0E, warm-neutral light #FAFAF9), 1 px hairlines instead of boxes, amber #FFC233 (light-mode text #8A5E00),
  live red #FF4D5E / #D7263D, ok green, warn orange, info blue. No other hues except artwork.

  Grid & breakpoints: 4 px spacing unit. Content column max 1240 px, 32 px gutters (16 px on phone).
  < 720 px: phone. Top bar + bottom tab bar, sheets from the bottom, guide becomes a Now/Next list.
  720–1099 px: tablet. 64 px icon rail, guide grid with narrow channel column.
  >= 1100 px: desktop. 232 px sidebar with live "Recording now" module. >= 1360 px: Home and Player gain a right column.

  Proudest decisions:
  1. The Time Ruler: one timeline component everywhere (home cards, player, recording detail) with programme bands, captured range, gaps, amber playhead, red live edge and a mono "−31:30 behind live" readout.
  2. "Catch up" as a first-class transport mode: play at 1.25× / 1.5× and the UI tells you exactly when you reach live ("live at 19:02").
  3. The rule editor's live preview evaluates the real conditions as you type and explains every near-miss ("Similar, won't record: contains 'Vorbericht'"), the fix for the Plex wrong-programme bug made visible.
  4. Zero layout shift by construction: skeletons are the real layout with text replaced by shimmer, and every async area has a reserved size.
  5. Live TV is not a separate destination: "Now" is a view of the Guide, and the palette can tune any channel in two keystrokes.
-->

.chlogo { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--line); font: 700 9.5px/1 var(--fm); letter-spacing: -.02em; color: var(--fg); text-transform: none; }
.chlogo.lg { width: 36px; height: 36px; border-radius: 9px; font-size: 11px; }
.empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--fg-2); }
.empty .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-3); margin-bottom: 4px; }
.empty h3 { font-size: 14px; color: var(--fg); font-weight: 600; }
.empty p { font-size: 13px; max-width: 42ch; }
.empty .btn { margin-top: 8px; }

/* problem / callout */
.prob { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.prob:first-child { border-top: 0; }
.prob .ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); grid-row: span 2; }
.prob.sev-err .ic { background: var(--red-soft); color: var(--red-text); }
.prob .ti { font-weight: 500; font-size: 13.5px; }
.prob .bd { grid-column: 2; font-size: 12.5px; color: var(--fg-2); }
.prob .ac { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 6px; align-self: center; }
.callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r2); background: var(--warn-soft); color: var(--fg); font-size: 13px; align-items: flex-start; }
.callout svg { color: var(--warn); margin-top: 1px; }
.callout.err { background: var(--red-soft); }
.callout.err svg { color: var(--red-text); }
.callout.ok { background: var(--green-soft); }
.callout.ok svg { color: var(--green); }
.callout.info { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.callout.info svg { color: var(--fg-3); }

/* forms */
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
.hint { font-size: 12px; color: var(--fg-3); }
.inp { height: 34px; width: 100%; padding: 0 10px; border-radius: var(--r2); border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); font-size: 13.5px; transition: border-color .12s, box-shadow .12s; min-width: 0; }
.inp:hover { border-color: var(--line-3); }
.inp:focus { border-color: var(--amber-line); box-shadow: 0 0 0 3px var(--amber-soft); outline: none; }
.inp::placeholder { color: var(--fg-4); }
.inp.mono { font-family: var(--fm); font-size: 12.5px; }
.inp.err { border-color: var(--red-line); }
select.inp { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 11px) 15px; background-size: 4px 4px; background-repeat: no-repeat; }
.inwrap { position: relative; display: flex; align-items: center; }
.inwrap > svg { position: absolute; left: 10px; color: var(--fg-3); pointer-events: none; }
.inwrap > .inp { padding-left: 32px; }
.inwrap > kbd { position: absolute; right: 8px; }
.switch { --w: 30px; width: var(--w); height: 18px; border-radius: 999px; background: var(--panel-3); border: 0; box-shadow: inset 0 0 0 1px var(--line-2); position: relative; flex: none; padding: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg-2); transition: transform .18s var(--ease), background .15s; }
.switch[aria-checked="true"] { background: var(--amber); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(12px); background: var(--amber-ink); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r2); height: 32px; background: var(--panel); overflow: hidden; }
.stepper button { width: 30px; height: 100%; border: 0; background: transparent; color: var(--fg-2); display: grid; place-items: center; }
.stepper button:hover { background: var(--hover); color: var(--fg); }
.stepper output { min-width: 64px; text-align: center; font: 500 12.5px var(--fm); padding: 0 4px; }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; border: 1px solid var(--line-2); border-radius: var(--r2); background: var(--panel); min-height: 34px; align-items: center; }
.tokens:focus-within { border-color: var(--amber-line); box-shadow: 0 0 0 3px var(--amber-soft); }
.tok { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 4px 0 8px; border-radius: 5px; background: var(--panel-3); font: 500 12px var(--fm); }
.tok button { border: 0; background: transparent; color: var(--fg-3); width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; padding: 0; }
.tok button:hover { color: var(--fg); background: var(--hover); }
.tokens input { border: 0; background: transparent; outline: none; flex: 1; min-width: 100px; height: 22px; font-size: 13px; padding: 0 4px; }
.days { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.days button { width: 34px; height: 30px; border-radius: var(--r2); border: 1px solid var(--line-2); background: transparent; color: var(--fg-2); font-size: 12px; font-weight: 500; }
.days button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* artwork */
.art { position: relative; aspect-ratio: 16/9; border-radius: var(--r2); overflow: hidden; background: var(--panel-3); flex: none; isolation: isolate; }
.art .bgx { position: absolute; inset: 0; }
.art .cap { position: absolute; left: 8px; bottom: 7px; right: 8px; font: 600 11px/1.15 var(--f); color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.4); letter-spacing: -.005em; }
.art .chb { position: absolute; top: 6px; left: 6px; font: 700 8.5px var(--fm); color: rgba(255,255,255,.85); background: rgba(0,0,0,.35); padding: 2px 4px; border-radius: 3px; backdrop-filter: blur(4px); }
.art .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.2); }
.art .prog i { display: block; height: 100%; background: var(--amber); }

/* ---------- time ruler ---------- */
.tr { position: relative; user-select: none; -webkit-user-select: none; touch-action: none; --pad: 0px; }
.tr-bands { position: relative; height: 22px; margin-bottom: 6px; }
.tr-band { position: absolute; top: 0; height: 22px; border-radius: 4px; padding: 0 6px; font-size: 11px; color: var(--fg-3); display: flex; align-items: center; overflow: hidden; white-space: nowrap; box-shadow: inset 1px 0 0 var(--line-2); }
.tr-band.cur { color: var(--fg); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
.tr-band.pad { font-family: var(--fm); font-size: 10px; color: var(--fg-4); box-shadow: none; justify-content: center; }
.tr-track { position: relative; height: 8px; border-radius: 4px; background: var(--track); cursor: pointer; }
.tr.compact .tr-track { height: 4px; border-radius: 2px; cursor: default; }
.tr-fut { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background-image: repeating-linear-gradient(-45deg, transparent 0 3px, var(--track) 3px 5px); }
.tr-cap { position: absolute; top: 0; bottom: 0; background: var(--track-cap); border-radius: 4px 0 0 4px; }
.tr-played { position: absolute; top: 0; bottom: 0; background: var(--track-played); border-radius: 4px 0 0 4px; }
.tr-gap { position: absolute; top: -2px; bottom: -2px; background: repeating-linear-gradient(-45deg, var(--red) 0 2px, transparent 2px 4px); border-radius: 2px; }
.tr-live { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--red); border-radius: 1px; }
.tr.compact .tr-live { top: -4px; bottom: -4px; }
.tr-live::after { content: ""; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--red); animation: pulse 1.6s infinite; }
.tr.compact .tr-live::after { width: 6px; height: 6px; margin: -3px 0 0 -3px; }
.tr-head { position: absolute; top: -7px; bottom: -7px; width: 2px; margin-left: -1px; background: var(--amber); border-radius: 1px; z-index: 2; transition: left .12s linear; }
.tr.dragging .tr-head { transition: none; }
.tr-head::before { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--bg), 0 2px 6px rgba(0,0,0,.4); transition: transform .12s; }
.tr:hover .tr-head::before, .tr.dragging .tr-head::before { transform: scale(1.15); }
.tr.compact .tr-head { top: -5px; bottom: -5px; }
.tr.compact .tr-head::before { width: 10px; height: 10px; margin: -5px 0 0 -5px; box-shadow: 0 0 0 2px var(--panel); }
.tr-ticks { position: relative; height: 18px; margin-top: 8px; }
.tr-tick { position: absolute; top: 0; font: 10.5px var(--fm); color: var(--fg-3); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tr-tick::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 4px; background: var(--line-3); }
.tr-tick.live { color: var(--red-text); font-weight: 600; }
.tr-tick.edge-l { transform: none; } .tr-tick.edge-l::before { left: 0; }
.tr-tick.edge-r { transform: translateX(-100%); } .tr-tick.edge-r::before { left: auto; right: 0; }
.tr-tip { position: absolute; bottom: calc(100% + 8px); transform: translateX(-50%); padding: 4px 7px; border-radius: 6px; background: var(--fg); color: var(--bg); font: 500 11px var(--fm); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 5; }
.tr-tip.show { opacity: 1; }
.tr-hover { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--fg-2); opacity: 0; pointer-events: none; }
.tr-hover.show { opacity: .7; }
.tr-labels { display: flex; justify-content: space-between; margin-top: 6px; font: 11px var(--fm); color: var(--fg-3); }
.tr-labels .l { color: var(--red-text); }
.behind { font: 500 13px var(--fm); font-variant-numeric: tabular-nums; color: var(--amber-text); white-space: nowrap; }
.behind.live { color: var(--red-text); }

/* ---------- home ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-content: start; }
.greet { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.greet h2 { font-size: 20px; font-weight: 600; }
.greet .t { color: var(--fg-3); font-size: 13px; }
.nowcard { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; padding: 16px; }
.nowcard .art { width: 100%; }
.nowcard .body { display: grid; gap: 12px; align-content: start; min-width: 0; }
.nowcard .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-2); }
.nowcard h3 { font-size: 18px; font-weight: 600; line-height: 1.25; }
.nowcard .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nowcard .acts .behind { margin-left: auto; }
.cw { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.cw a { min-width: 0; grid-template-columns: minmax(0, 1fr); display: grid; gap: 8px; border-radius: var(--r2); padding: 0; transition: transform .15s var(--ease); }
.cw a:hover .art { box-shadow: 0 0 0 1px var(--line-3); }
.cw a:hover .ti { color: var(--fg); }
.cw .ti { font-size: 13px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.cw .su { font-size: 12px; color: var(--fg-3); display: flex; justify-content: space-between; gap: 8px; }
.home-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.ontv .row { min-height: 52px; }
.ontv .pbar { height: 2px; background: var(--track); border-radius: 1px; margin-top: 5px; overflow: hidden; }
.ontv .pbar i { display: block; height: 100%; background: var(--fg-3); }

/* ---------- guide ---------- */
.gtools { display: flex; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 53px; }
.gtools .sp { flex: 1; }
.gwrap { position: relative; height: calc(100dvh - var(--top-h) - 53px); overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.ggrid { position: relative; width: calc(var(--chw) + var(--gw)); }
.gline { display: flex; width: calc(var(--chw) + var(--gw)); }
.gline.head { position: sticky; top: 0; z-index: 6; }
.gline > .gch, .gline > .gcorner { width: var(--chw); flex: none; }
.gline > .grow-r, .gline > .gtime { width: var(--gw); flex: none; }
.gcorner { position: sticky; left: 0; z-index: 7; background: var(--bg); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 36px; display: flex; align-items: center; padding: 0 12px; font: 500 11px var(--fm); color: var(--fg-3); }
.gtime { position: relative; z-index: 5; height: 36px; background: var(--bg); border-bottom: 1px solid var(--line); }
.gtime span { position: absolute; top: 0; height: 36px; display: flex; align-items: center; padding-left: 8px; font: 11.5px var(--fm); color: var(--fg-3); border-left: 1px solid var(--line); }
.gtime span.half { color: var(--fg-4); border-left-style: dashed; }
.gtime .nowtag { position: absolute; top: 9px; height: 18px; padding: 0 5px; border-radius: 4px; background: var(--red); color: #fff; font: 600 10.5px/18px var(--fm); transform: translateX(-50%); z-index: 2; }
.gch { position: sticky; left: 0; z-index: 4; background: var(--bg); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: var(--rowh); display: flex; align-items: center; gap: 10px; padding: 0 12px; min-width: 0; }
.gch .no { font: 11px var(--fm); color: var(--fg-3); width: 16px; text-align: right; flex: none; }
.gch .nm { font-size: 13px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow-r { position: relative; height: var(--rowh); border-bottom: 1px solid var(--line); }
.gp { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; overflow: clip; border: 0; text-align: left; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); transition: background .1s, box-shadow .1s; }
.gp:hover { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.gp:active { background: var(--panel-3); }
.gp:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; z-index: 2; }
.gp { align-items: flex-start; }
.gp > span { position: sticky; left: calc(var(--chw) + 9px); width: fit-content; max-width: 100%; }
.gp .ti { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.gp .tm { font: 11px var(--fm); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp.past { background: transparent; color: var(--fg-3); }
.gp.past .ti { color: var(--fg-2); font-weight: 400; }
.gp.air { background: var(--panel-2); }
.gp.air::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: var(--p); background: var(--fg-3); }
.gp.rec { box-shadow: inset 0 0 0 1px var(--red-line); }
.gp.rec.air { background: var(--red-soft); }
.gp.off { background: repeating-linear-gradient(-45deg, transparent 0 6px, var(--hover) 6px 8px); box-shadow: none; color: var(--fg-3); cursor: default; }
.gp.tiny { padding: 7px 4px; }
.gp.tiny .tm { display: none; }
.gp.sel { box-shadow: inset 0 0 0 2px var(--amber); }
.gnow { position: absolute; top: 36px; bottom: 0; width: 2px; margin-left: -1px; background: var(--red); z-index: 3; pointer-events: none; }
.gnow::before { content: ""; position: absolute; inset: 0 -4px; background: linear-gradient(90deg, transparent, var(--red-soft), transparent); }
.gpast { position: absolute; top: 36px; bottom: 0; left: 0; background: color-mix(in oklab, var(--bg) 35%, transparent); pointer-events: none; z-index: 1; }
.gkeys { position: absolute; right: 16px; bottom: 16px; z-index: 7; display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); font-size: 11.5px; color: var(--fg-3); }
.glist { display: none; }

/* drawer / sheet */
.ovl { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; transition: opacity .2s; }
.ovl.on { opacity: 1; }
.drawer { position: fixed; z-index: 61; top: 8px; right: 8px; bottom: 8px; width: min(440px, calc(100vw - 16px)); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; transform: translateX(16px); opacity: 0; transition: transform .24s var(--ease), opacity .2s; overflow: hidden; }
.drawer.on { transform: none; opacity: 1; }
.drawer:focus, .pal:focus, .modal:focus { outline: none; }
.drawer .dh { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.drawer .dh .sp { flex: 1; }
.drawer .db { overflow: auto; padding: 16px; display: grid; gap: 18px; align-content: start; flex: 1; }
.drawer .df { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex: none; flex-wrap: wrap; }
.drawer .grab { display: none; }
.pd-title { font-size: 20px; font-weight: 600; line-height: 1.25; }
.pd-meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--fg-2); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; min-width: 0; }
.optgroup { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r3); overflow: hidden; }
.opt { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 10px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; align-items: center; transition: background .1s; }
.opt:first-child { border-top: 0; }
.opt:hover { background: var(--hover); }
.opt .r { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-3); grid-row: span 2; }
.opt[aria-checked="true"] .r { box-shadow: inset 0 0 0 5px var(--amber); }
.opt .ot { font-weight: 500; font-size: 13.5px; }
.opt .os { grid-column: 2; font-size: 12px; color: var(--fg-3); }
.opt .ox { grid-row: span 2; grid-column: 3; }

/* ---------- player ---------- */
.player { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; background: var(--bg); }
.pbar-top { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.pbar-top .ttl { min-width: 0; display: flex; align-items: center; gap: 10px; flex: 1; }
.pbar-top .ttl b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.pmain { min-width: 0; display: flex; flex-direction: column; padding: 16px 16px 24px; gap: 16px; }
.screen { position: relative; aspect-ratio: 16/9; width: 100%; max-height: calc(100dvh - 52px - 230px); margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; color: #fff; isolation: isolate; container-type: inline-size; }
.screen.fs { position: fixed; inset: 0; z-index: 70; max-height: none; border-radius: 0; aspect-ratio: auto; }
.frame { position: absolute; inset: 0; }
.frame .sweep { position: absolute; inset: -20%; background: radial-gradient(60% 50% at 30% 60%, rgba(255,255,255,.08), transparent 70%); animation: sweep 9s ease-in-out infinite alternate; }
.screen.paused .sweep { animation-play-state: paused; }
@keyframes sweep { to { transform: translate(18%, -6%); } }
.osd-tower { position: absolute; left: 3.2%; top: 6%; width: min(30%, 210px); font: 600 clamp(8px, 1.4cqw, 12px)/1 var(--fm); background: rgba(10,10,14,.78); border-radius: 4px; overflow: hidden; }
.osd-tower .hd { padding: .55em .7em; background: rgba(225,6,0,.9); font-family: var(--f); letter-spacing: .04em; display: flex; justify-content: space-between; }
.osd-tower div.r { display: grid; grid-template-columns: 1.6em 3.2em 1fr; padding: .38em .7em; border-top: 1px solid rgba(255,255,255,.06); }
.osd-tower div.r span:last-child { text-align: right; color: rgba(255,255,255,.75); }
.osd-bug { position: absolute; right: 3%; top: 6%; font: 700 clamp(8px, 1.3cqw, 12px) var(--f); letter-spacing: .06em; opacity: .75; }
.osd-title { position: absolute; left: 4%; bottom: 7%; right: 30%; }
.osd-title b { display: block; font-size: clamp(14px, 3.6cqw, 34px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.osd-title span { font-size: clamp(10px, 1.5cqw, 14px); opacity: .7; }
.screen .bigplay { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s; pointer-events: none; }
.screen .bigplay i { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); }
.screen.paused .bigplay { opacity: 1; }
.screen .flash { position: absolute; top: 50%; transform: translateY(-50%); padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.55); font: 600 13px var(--fm); opacity: 0; transition: opacity .2s; backdrop-filter: blur(6px); }
.screen .flash.on { opacity: 1; }
.screen .flash.l { left: 6%; } .screen .flash.r { right: 6%; }
.screen .liveb { position: absolute; right: 3%; bottom: 7%; display: flex; gap: 6px; align-items: center; }
.screen .err { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 10px; background: rgba(8,8,10,.86); padding: 20px; }
.screen .err h3 { font-size: 16px; font-weight: 600; }
.screen .err p { font-size: 13px; color: rgba(255,255,255,.7); max-width: 44ch; }
.screen .fsctl { display: none; }
.screen.fs .fsctl { display: block; position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 24px 20px; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.transport { display: grid; gap: 14px; }
.readout { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.readout .big { font: 500 44px/0.9 var(--fm); letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--fg); }
.readout .big.amb { color: var(--amber-text); }
.readout .big.lv { color: var(--red-text); display: inline-flex; align-items: center; gap: 12px; }
.readout .lab { display: grid; gap: 3px; padding-bottom: 2px; }
.readout .lab b { font-size: 13px; font-weight: 500; }
.readout .lab span { font: 12px var(--fm); color: var(--fg-3); }
.readout .sp { flex: 1; }
.ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ctl .grp { display: flex; align-items: center; gap: 4px; }
.ctl .sp { flex: 1; }
.pbtn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: var(--r2); border: 1px solid transparent; background: transparent; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 500; transition: background .12s, transform .08s; white-space: nowrap; position: relative; }
.pbtn:hover { background: var(--hover); }
.pbtn:active { background: var(--press); transform: scale(.97); }
.pbtn.play { width: 44px; height: 44px; border-radius: 50%; background: var(--fg); color: var(--bg); padding: 0; }
.pbtn.play:hover { background: var(--fg); opacity: .9; }
.pbtn.play svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.pbtn.on { background: var(--amber-soft); color: var(--amber-text); }
.pbtn.lv { color: var(--red-text); }
.pbtn.lv.at { background: var(--red-soft); }
.pbtn kbd { font-size: 10px; height: 16px; padding: 1px 4px; }
.pbtn .lbl2 { color: var(--fg-3); font-size: 12px; font-weight: 400; }
.menu { position: absolute; z-index: 40; min-width: 220px; padding: 4px; border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); display: grid; gap: 1px; }
.menu .mh { font-size: 11px; color: var(--fg-3); padding: 6px 8px 4px; font-weight: 500; }
.menu button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; border: 0; background: transparent; text-align: left; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
.menu button .ck { width: 16px; color: var(--amber-text); }
.menu button .r { margin-left: auto; font: 11px var(--fm); color: var(--fg-3); }
.streaminfo { font: 11.5px var(--fm); color: var(--fg-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.streaminfo b { color: var(--fg-2); font-weight: 500; }
.prail { border-left: 1px solid var(--line); padding: 16px; display: grid; gap: 20px; align-content: start; overflow: auto; max-height: calc(100dvh - 52px); position: sticky; top: 0; }
.shortcuts { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 12.5px; color: var(--fg-2); align-items: center; }
.shortcuts > span:nth-child(even) { display: flex; gap: 3px; justify-content: flex-end; }

/* ---------- library ---------- */
.lib { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 24px; align-items: start; }
.tree { position: sticky; top: calc(var(--top-h) + 16px); display: grid; gap: 1px; font-size: 13px; }
.tree a { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: var(--fg-2); min-width: 0; transition: background .1s, color .1s; }
.tree a:hover { background: var(--hover); color: var(--fg); }
.tree a[aria-current="true"] { background: var(--panel-3); color: var(--fg); font-weight: 500; }
.tree a .c { margin-left: auto; font: 11px var(--fm); color: var(--fg-3); }
.tree a .c.new { color: var(--amber-text); }
.tree .d1 { padding-left: 26px; } .tree .d2 { padding-left: 44px; }
.tree .chev { width: 12px; height: 12px; color: var(--fg-3); transition: transform .15s; }
.tree .chev.open { transform: rotate(90deg); }
.tree .gh { font-size: 11px; font-weight: 500; color: var(--fg-3); padding: 12px 8px 4px; }
.ltools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.ltools .sp { flex: 1; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.tbl td.c1, .tbl td .ti { overflow: hidden; text-overflow: ellipsis; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--fg-3); padding: 0 10px 8px; white-space: nowrap; border-bottom: 1px solid var(--line); }
.tbl td { padding: 0 10px; height: 48px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl tr { transition: background .1s; }
.tbl tbody tr:hover { background: var(--hover); cursor: pointer; }
.tbl tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.tbl .t { color: var(--fg-2); font-size: 12px; }
.tbl .r { text-align: right; }
.tbl .tc { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tbl .tc .ti { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.wbar { width: 48px; height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.wbar i { display: block; height: 100%; background: var(--amber); }
.wstate { width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; }
.wstate.new { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); width: 8px; height: 8px; margin: 4px; }
.wstate.done { color: var(--fg-4); }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
.folder { display: grid; gap: 8px; padding: 10px; border-radius: var(--r3); border: 1px solid var(--line); background: var(--panel); transition: border-color .12s, background .12s; }
.folder:hover { border-color: var(--line-2); background: var(--panel-2); }
.folder .ti { font-weight: 500; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
.folder .su { font: 11.5px var(--fm); color: var(--fg-3); }
.rd-hero { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
.rd-hero .body { display: grid; gap: 12px; min-width: 0; }
.rd-cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; margin-top: 28px; align-items: start; }
.why { font-size: 12.5px; color: var(--fg-2); display: flex; gap: 8px; align-items: flex-start; }
.why code { font-family: var(--fm); font-size: 12px; color: var(--fg); background: var(--panel-3); padding: 1px 4px; border-radius: 4px; }
.confirm { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: var(--r2); background: var(--red-soft); font-size: 13px; animation: pop .18s var(--ease); flex-wrap: wrap; }
@keyframes pop { from { opacity: 0; transform: translateY(2px) scale(.99); } }

/* ---------- rules ---------- */
.rule-ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 24px; align-items: start; }
.rule-form { display: grid; gap: 22px; }
.rule-form .grp { display: grid; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.rule-form .grp:last-child { border-bottom: 0; }
.rule-form .grp > h3 { font-size: 13px; font-weight: 600; }
.cond { display: grid; grid-template-columns: 170px minmax(0, 1fr) 28px; gap: 8px; align-items: start; }
.summary { font-size: 14px; line-height: 1.6; color: var(--fg-2); padding: 14px 16px; border-radius: var(--r3); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.summary b { color: var(--fg); font-weight: 500; }
.summary q { color: var(--fg); font-family: var(--fm); font-size: 12.5px; quotes: "“" "”"; }
.preview { position: sticky; top: calc(var(--top-h) + 16px); display: grid; gap: 0; }
.preview .ph { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.preview .ph .sp { flex: 1; }
.preview .grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; font-size: 12px; font-weight: 600; }
.preview .grp-h .c { font: 500 11px var(--fm); color: var(--fg-3); }
.pv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 1px 10px; padding: 7px 14px; font-size: 13px; animation: pop .2s var(--ease); }
.pv .d { font: 11.5px var(--fm); color: var(--fg-3); grid-row: span 2; padding-top: 1px; line-height: 1.35; }
.pv .ti { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv .ti mark { background: var(--amber-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.pv .why2 { font-size: 11.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv .why2.no { color: var(--warn); }
.pv.off .ti { color: var(--fg-2); font-weight: 400; }
.rtbl .cnd { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- settings ---------- */
.set { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
.setnav { position: sticky; top: calc(var(--top-h) + 16px); display: grid; gap: 1px; }
.setnav a { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border-radius: 6px; color: var(--fg-2); font-size: 13px; font-weight: 500; }
.setnav a:hover { background: var(--hover); color: var(--fg); }
.setnav a[aria-current="page"] { background: var(--panel-3); color: var(--fg); }
.setnav-m { display: none; }
.sblock { display: grid; gap: 12px; margin-bottom: 36px; }
.sblock > header { display: flex; align-items: flex-end; gap: 12px; }
.sblock > header > div { flex: 1; min-width: 0; }
.sblock h2 { font-size: 15px; font-weight: 600; }
.sblock h2 + p { font-size: 13px; color: var(--fg-2); margin-top: 2px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .ti { font-weight: 500; font-size: 13.5px; }
.srow .su { font-size: 12.5px; color: var(--fg-2); grid-column: 1; }
.srow .ctl2 { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
.srccard { padding: 16px; display: grid; gap: 14px; }
.srccard .hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.srccard .hd .grow { flex: 1; min-width: 160px; }
.srccard .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r2); overflow: hidden; border: 1px solid var(--line); }
.srccard .stats div { background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; }
.srccard .stats b { font: 500 15px var(--fm); }
.srccard .stats span { font-size: 11.5px; color: var(--fg-3); }
.hw { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; padding: 16px; align-items: center; }
.hw .chip-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); }
.caps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--track); border-radius: 2px; outline-offset: 6px; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 3px var(--bg); cursor: pointer; }
.slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--fg); border: 0; }

/* ---------- auth ---------- */
.auth { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
.auth-top { display: flex; align-items: center; gap: 10px; padding: 16px 24px; }
.auth-top .sp { flex: 1; }
.auth-mid { display: grid; place-items: center; padding: 24px 16px 48px; }
.auth-card { width: min(420px, 100%); display: grid; gap: 20px; }
.auth-card.wide { width: min(760px, 100%); }
.auth-card h1 { font-size: 22px; font-weight: 600; }
.auth-card .lede { color: var(--fg-2); font-size: 14px; margin-top: 4px; }
.auth-foot { padding: 16px 24px; font-size: 12px; color: var(--fg-3); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
.steps span { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); }
.steps span b { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 10.5px var(--fm); box-shadow: inset 0 0 0 1px var(--line-3); }
.steps span.on { color: var(--fg); } .steps span.on b { background: var(--fg); color: var(--bg); box-shadow: none; }
.steps span.done b { background: var(--green-soft); color: var(--green); box-shadow: none; }
.steps i { width: 20px; height: 1px; background: var(--line-2); }
.codebox { display: flex; gap: 6px; justify-content: center; align-items: center; }
.codebox input { width: 44px; height: 54px; text-align: center; font: 500 22px var(--fm); border-radius: var(--r2); border: 1px solid var(--line-2); background: var(--panel); text-transform: uppercase; }
.codebox input:focus { border-color: var(--amber-line); box-shadow: 0 0 0 3px var(--amber-soft); outline: none; }
.codebox .dash { color: var(--fg-4); font: 20px var(--fm); }
.device { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px; align-items: center; }
.device .ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-3); }
.divider { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--fg-3); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pwm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pwm i { height: 3px; border-radius: 2px; background: var(--track); }
.pwm i.on { background: var(--green); }

/* ---------- palette, toasts, modal ---------- */
.pal { position: fixed; z-index: 81; left: 50%; top: 12vh; width: min(640px, calc(100vw - 24px)); transform: translateX(-50%) scale(.98); opacity: 0; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; transition: transform .16s var(--ease), opacity .14s; display: flex; flex-direction: column; max-height: min(560px, 76dvh); }
.pal.on { opacity: 1; transform: translateX(-50%) scale(1); }
.pal .pin { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; border-bottom: 1px solid var(--line); flex: none; }
.pal .pin input { flex: 1; border: 0; background: transparent; outline: none; font-size: 15px; min-width: 0; }
.pal .pin input::placeholder { color: var(--fg-3); }
.pal .res { overflow: auto; padding: 6px; flex: 1; }
.pal .gh { font-size: 11px; font-weight: 500; color: var(--fg-3); padding: 10px 10px 4px; }
.pal .it { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; min-width: 0; }
.pal .it .ic { width: 24px; height: 24px; display: grid; place-items: center; color: var(--fg-3); flex: none; }
.pal .it .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal .it .tx small { color: var(--fg-3); font-size: 12px; margin-left: 6px; }
.pal .it .hint2 { font: 11px var(--fm); color: var(--fg-3); flex: none; display: flex; gap: 3px; }
.pal .it mark { background: none; color: var(--amber-text); font-weight: 600; }
.pal .it[aria-selected="true"] { background: var(--panel-3); }
.pal .it[aria-selected="true"] .ic { color: var(--fg); }
.pal .pf { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--fg-3); flex: none; flex-wrap: wrap; }
.pal .pf span { display: inline-flex; gap: 5px; align-items: center; }
.modal { position: fixed; z-index: 81; left: 50%; top: 50%; width: min(560px, calc(100vw - 24px)); max-height: 84dvh; overflow: auto; transform: translate(-50%, -48%); opacity: 0; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); transition: transform .18s var(--ease), opacity .14s; }
.modal.on { opacity: 1; transform: translate(-50%, -50%); }
.modal .mh2 { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.modal .mh2 h2 { font-size: 14px; font-weight: 600; flex: 1; }
.modal .mb { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.modal .mb h3 { font-size: 12px; color: var(--fg-3); font-weight: 500; margin-bottom: 8px; }
.toasts { position: fixed; z-index: 90; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(380px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); font-size: 13px; position: relative; overflow: hidden; animation: tin .22s var(--ease); }
.toast.out { animation: tout .18s var(--ease) forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes tout { to { opacity: 0; transform: translateY(4px) scale(.98); } }
.toast .tx { flex: 1; min-width: 0; }
.toast .ic { color: var(--green); }
.toast.err .ic { color: var(--red-text); }
.toast .tp { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--line-3); animation: tp linear forwards; }
@keyframes tp { from { width: 100%; } to { width: 0; } }

/* ---------- loading (final geometry, text replaced by shimmer) ---------- */
.is-loading #view { pointer-events: none; }
.is-loading #view :is(span, div, a, dd, dt, th, label, p, b, small, button, td):not(:has(*)):not(:empty):not(.tr-tip):not(.flash),
.is-loading #view :is(h1, h2, h3, p, b, small, .ti, .su, .t, .tm, .c, .tag, .tok, .crumbs a, .crumbs b, td span, td, label, .lbl, .hint, .behind, .meta, .big, dd, dt, .nm, .no, .cap, .chb, .gp .ti, .gtime span, .tr-band, .tr-tick, kbd, .seg button, .chip, .btn, .pbtn, .link, .summary, .opt, .inp, .tokens, .switch, .stepper, .readout .lab span):not(:has(:is(h1,h2,h3,p,.ti,.su,.tag,.btn,td,.inp))) {
  color: transparent !important; background: linear-gradient(90deg, var(--sk) 0 40%, var(--sk-hi) 50%, var(--sk) 60% 100%) 0 0 / 300% 100% !important; border-color: transparent !important; box-shadow: none !important; border-radius: 5px; animation: shimmer 1.3s linear infinite; text-shadow: none !important; }
.is-loading #view :is(svg, .chlogo, .art .bgx, .art .prog, .tr-head, .tr-live, .tr-played, .tr-cap, .tr-gap, .gnow, .dot, .recdot, .wbar, .wstate, input::placeholder) { opacity: 0 !important; }
.is-loading #view .chlogo, .is-loading #view .art { background: var(--sk) !important; box-shadow: none !important; }
.is-loading #view .chlogo { opacity: 1 !important; color: transparent; }
.is-loading #view .tr-track { background: var(--sk) !important; }
.is-loading #view .tr-fut { opacity: 0; }
.is-loading #view .screen { background: var(--sk) !important; }
.is-loading #view .screen > * { opacity: 0 !important; }
.is-loading #view .gp { background: var(--sk) !important; box-shadow: none !important; color: transparent; }
.is-loading #view .gp > * { opacity: 0; }
@keyframes shimmer { to { background-position: -150% 0; } }

/* ---------- tablet: icon rail ---------- */
@media (max-width: 1099px) {
  :root { --side-w: 64px; }
  .side { padding: 10px 8px; align-items: center; }
  .side-brand { padding: 0; justify-content: center; }
  .side-brand b, .side-brand .srv, .searchbtn span, .searchbtn kbd, .nav-sec, .nav a span, .nav a .badge-n, .nav a .k, .nowmod, .storage, .me .n, .me .theme { display: none; }
  .searchbtn { width: 40px; justify-content: center; padding: 0; }
  .nav a { width: 40px; height: 36px; justify-content: center; padding: 0; }
  .nav a .badge-n.warn { display: block; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; font-size: 0; border-radius: 50%; background: var(--warn); }
  .nav.cols { display: none; }
  .me { padding: 10px 0 0; justify-content: center; }
  .side-foot .recpill { display: grid; }
  .home-grid .nowcard { grid-template-columns: 200px minmax(0, 1fr); }
  .lib { grid-template-columns: minmax(0, 1fr); }
  .tree { display: none; }
  .rule-ed { grid-template-columns: minmax(0, 1fr); }
  .preview { position: static; }
  .set { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .setnav { display: none; }
  .setnav-m { display: flex; margin-bottom: 4px; }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .prail { border-left: 0; border-top: 1px solid var(--line); position: static; max-height: none; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding: 16px; }
  .rd-cols { grid-template-columns: minmax(0, 1fr); }
  .screen { max-height: none; }
}
.side-foot .recpill { display: none; place-items: center; width: 40px; height: 36px; border-radius: 8px; background: var(--red-soft); color: var(--red-text); margin: 0 auto; }

/* ---------- wide ---------- */
@media (min-width: 1360px) {
  .home-cols { grid-template-columns: minmax(0, 1fr) 360px; }
}

/* ---------- phone ---------- */
@media (max-width: 719px) {

  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }

  .topbar .mk { width: 22px; height: 22px; flex: none; }
  .topbar b { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .recp { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--red-soft); color: var(--red-text); font: 500 11.5px var(--fm); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: color-mix(in oklab, var(--side) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }

  .tabs a[aria-current="page"] { color: var(--fg); }
  .tabs a[aria-current="page"] svg { color: var(--amber-text); }
  .tabs a:active svg { transform: scale(.92); }
  .tabs a .bd { position: absolute; top: 8px; left: calc(50% + 8px); width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--side); }
  .main { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
  .app.immersive .main { padding-bottom: 0; }
  .bar { top: calc(52px + env(safe-area-inset-top)); padding: 0 16px; height: 48px; }
  .bar.phone-hide { display: none; }
  .bar .meta.hide-s, .hide-s { display: none !important; }
  .wrap { padding: 16px 16px 40px; }
  .nowcard { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; overflow: hidden; }
  .home-grid .nowcard { grid-template-columns: minmax(0, 1fr); }
  .nowcard > a:first-child { display: none; }
  .nowcard .body { padding: 14px; }
  .nowcard .acts .btn { flex: 1; }
  .nowcard .acts .behind { width: 100%; order: -1; margin: 0; }
  .cw { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 72%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .cw a { scroll-snap-align: start; }
  .row .tm { width: 80px; }
  .prob { grid-template-columns: auto 1fr; }
  .prob .ac { grid-column: 2; grid-row: auto; margin-top: 8px; }
  .gtools { padding: 8px 16px; position: sticky; top: calc(52px + env(safe-area-inset-top)); z-index: 12; background: var(--bg); }
  .gwrap, .gkeys { display: none; }
  .glist { display: block; }
  .drawer { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 88dvh; border-radius: 16px 16px 0 0; transform: translateY(24px); padding-bottom: env(safe-area-inset-bottom); }
  .drawer .grab { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line-3); margin: 8px auto 0; flex: none; }
  .drawer .df .btn { flex: 1; }
  .pbar-top { padding: 0 8px; }
  .pmain { padding: 0 0 16px; gap: 14px; }
  .screen { border-radius: 0; }
  .transport { padding: 0 16px; }
  .readout .big { font-size: 36px; }
  .ctl .hide-s { display: none; }
  .ctl { justify-content: space-between; }
  .ctl .sp { display: none; }
  .ctl .opts { width: 100%; display: flex; gap: 6px; }
  .ctl .opts .pbtn { flex: 1; border: 1px solid var(--line); }
  .pbtn kbd { display: none; }
  .prail { grid-template-columns: minmax(0, 1fr); }
  .tbl.resp thead { display: none; }
  .tbl.resp, .tbl.resp tbody, .tbl.resp tr { display: block; }
  .tbl.resp tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 2px 10px; }
  .tbl.resp td { display: block; height: auto; padding: 0; border: 0; }
  .tbl.resp td.hs { display: none; }
  .tbl.resp td.c1 { grid-column: 1; }
  .tbl.resp td.c2 { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; }
  .tbl.resp td.sub { grid-column: 1; font-size: 12px; color: var(--fg-3); }
  .rd-hero { grid-template-columns: minmax(0, 1fr); }
  .cond { grid-template-columns: minmax(0, 1fr) 28px; }
  .cond select { grid-column: 1; }
  .cond .tokens, .cond > input.inp { grid-column: 1 / span 2; }
  .cond > button { grid-column: 2; grid-row: 1; }
  .srccard .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hw { grid-template-columns: auto 1fr; }
  .hw > .btn { grid-column: 1 / -1; }
  .srow { grid-template-columns: minmax(0, 1fr); }
  .srow .ctl2 { grid-column: 1; grid-row: auto; margin-top: 8px; flex-wrap: wrap; }
  .toasts { left: 12px; right: 12px; width: auto; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 10px); }
  .app.immersive ~ .toasts, .toasts.imm { bottom: 16px; }
  .pal { top: 8px; }
  .pal .pf { display: none; }
  .modal .mb { grid-template-columns: 1fr; }
  .auth-top { padding: 12px 16px; }
  .codebox input { width: 40px; height: 50px; }
  .ltools > .inwrap { width: 100% !important; order: 5; }
  .folders { grid-template-columns: minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r3); overflow: hidden; background: var(--panel); }
  .folder { grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: auto auto; gap: 2px 12px; border: 0; border-radius: 0; border-top: 1px solid var(--line); align-items: center; }
  .folder:first-child { border-top: 0; }
  .folder .art { grid-row: span 2; border-radius: 5px; }
  .folder .art .chb { display: none; }
}
.booting .app { visibility: hidden; }
.app.immersive { grid-template-columns: minmax(0, 1fr); }
.app.immersive .side, .app.immersive .tabs, .app.immersive .topbar { display: none; }

/* =========================================================
   Time ruler
   ========================================================= */
function trHTML(o) {
  const span = o.to - o.from, pct = t => Math.max(0, Math.min(100, (t - o.from) / span * 100));
  let bands = "";
  if (o.bands) bands = `<div class="tr-bands">${o.bands.map(b => `<div class="tr-band ${b.cur ? "cur" : ""} ${b.pad ? "pad" : ""}" style="left:${pct(b.a)}%;width:${pct(b.b) - pct(b.a)}%" title="${esc(b.label)}">${esc(b.label)}</div>`).join("")}</div>`;
  let ticks = "";
  if (o.tickEvery) {
    const step = o.tickEvery * MIN; let t = Math.ceil(o.from / step) * step; const arr = [];
    while (t <= o.to) { arr.push(t); t += step; }
    ticks = `<div class="tr-ticks">${arr.map(t => { const p = pct(t); return `<span class="tr-tick ${p < 3 ? "edge-l" : p > 97 ? "edge-r" : ""}" style="left:${p}%">${hm(t)}</span>`; }).join("")}</div>`;
  }
  const gaps = (o.gaps || []).map(g => `<div class="tr-gap" style="left:${pct(g[0])}%;width:${Math.max(.6, pct(g[1]) - pct(g[0]))}%" title="Missing ${hm(g[0])}–${hm(g[1])}"></div>`).join("");
  return `<div class="tr ${o.compact ? "compact" : ""}" data-tr="${o.id || ""}" ${o.seek ? `role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="100"` : ""}>
    ${bands}
    <div class="tr-track">
      <div class="tr-fut"></div><div class="tr-cap"></div><div class="tr-played"></div>${gaps}
      ${o.live ? `<div class="tr-live" title="Live"></div>` : ""}
      ${o.pos != null ? `<div class="tr-head"></div>` : ""}
      <div class="tr-hover"></div><div class="tr-tip"></div>
    </div>${ticks}</div>`;
}
function trSet(root, o) {
  if (!root) return;
  const span = o.to - o.from, pct = t => Math.max(0, Math.min(100, (t - o.from) / span * 100));
  const capEnd = o.live ? o.liveAt : o.capEnd;
  const s = (sel, css) => { const el = root.querySelector(sel); if (el) Object.assign(el.style, css); };
  s(".tr-cap", { left: pct(o.capStart) + "%", width: (pct(capEnd) - pct(o.capStart)) + "%" });
  s(".tr-fut", { left: pct(capEnd) + "%", width: (100 - pct(capEnd)) + "%" });
  if (o.pos != null) { s(".tr-played", { left: pct(o.capStart) + "%", width: (pct(o.pos) - pct(o.capStart)) + "%" }); s(".tr-head", { left: pct(o.pos) + "%" }); }
  if (o.live) s(".tr-live", { left: pct(o.liveAt) + "%" });
  if (root.getAttribute("role") === "slider") { root.setAttribute("aria-valuenow", Math.round(pct(o.pos))); root.setAttribute("aria-valuetext", o.live ? clock(o.pos - o.liveAt, true) + " behind live" : clock(o.pos - o.capStart)); }
}
/* compact ruler used on cards: live recording */
function liveMini(r, pos) {
  const o = { from: r.start, to: r.end, capStart: r.start, liveAt: now(), live: true, pos, compact: true, id: "mini-" + r.id };
  return { html: trHTML(o), o };
}

/* =========================================================
   Toasts, overlays
   ========================================================= */
function toast(msg, opts = {}) {
  const el = document.createElement("div"); el.className = "toast " + (opts.err ? "err" : "");
  const dur = opts.dur || 4200;
  el.innerHTML = `${ic(opts.err ? "alert-c" : opts.icon || "check-c", "ic")}<div class="tx">${msg}</div>${opts.action ? `<button class="btn sm ghost" data-t="a">${esc(opts.action)}</button>` : ""}<button class="iconbtn sm" data-t="x" aria-label="Dismiss">${ic("x", "s")}</button><span class="tp" style="animation-duration:${dur}ms"></span>`;
  const box = $("#toasts"); box.appendChild(el);
  const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 180); };
  const tm = setTimeout(kill, dur);
  el.addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; clearTimeout(tm); if (b.dataset.t === "a" && opts.onAction) opts.onAction(); kill(); });
}
let layerClose = null;
function openLayer(html, cls, onClose) {
  closeLayer(true);
  const L = $("#layer");
  L.innerHTML = `<div class="ovl" data-close></div>${html}`;
  const panel = L.lastElementChild; panel.classList.add(...cls.split(" "));
  const prev = document.activeElement;
  requestAnimationFrame(() => { L.querySelector(".ovl").classList.add("on"); panel.classList.add("on"); });
  L.querySelector(".ovl").addEventListener("click", () => closeLayer());
  layerClose = () => { onClose && onClose(); if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true }); };
  return panel;
}
function closeLayer(silent) {
  const L = $("#layer"); if (!L.firstChild) return;
  const fn = layerClose; layerClose = null;
  const items = [...L.children]; items.forEach(n => n.classList.remove("on"));
  setTimeout(() => items.forEach(n => n.remove()), silent ? 0 : 200);
  if (!silent && fn) fn();
}
function trapFocus(panel) {
  if (!panel.querySelector("[autofocus]") && !panel.classList.contains("pal")) { panel.setAttribute("tabindex", "-1"); setTimeout(() => panel.focus(), 30); return; }
  const f = panel.querySelector("[autofocus]") || panel.querySelector("input, button, [tabindex='0']");
  if (f) setTimeout(() => f.focus(), 30);
}

function mountRule() {

    if (b.dataset.untok) { const [i, j] = b.dataset.untok.split(":").map(Number); DRAFT.conds[i].v.splice(j, 1); ruleRefresh(true); }
    if (b.dataset.rmcond) { DRAFT.conds.splice(+b.dataset.rmcond, 1); ruleRefresh(true); }
    if (b.dataset.act === "addcond") { DRAFT.conds.push({ k: "none", v: [] }); ruleRefresh(true); const ins = $$("[data-tokin]"); ins[ins.length - 1].focus(); }
    if (b.dataset.act === "ruledelask") { $("#rdel").innerHTML = `<div class="confirm">Delete “${esc(DRAFT.name)}”? Its ${DRAFT.count} recordings stay.<button type="button" class="btn sm danger solid" data-act="ruledel">Delete rule</button><button type="button" class="btn sm ghost" data-act="rulecancel">Keep</button></div>`; $('[data-act="ruledel"]').focus(); }

function saveRule() {

<script>

/* =========================================================

function route() {

    delask: () => { const c = $("#rdconfirm"); c.innerHTML = `<div class="confirm" style="margin-top:8px">Delete for good? ${recById[route().parts[2]].size.toFixed(1)} GB is freed.<button class="btn sm danger solid" data-act="delyes">Delete</button><button class="btn sm ghost" data-act="delno">Cancel</button></div>`; c.querySelector("[data-act=delno]").focus(); },
    delno: () => { $("#rdconfirm").innerHTML = ""; },
    delyes: () => { const id = route().parts[2]; const r = recById[id]; S.deleted.add(id); location.hash = "#/library/c/" + r.path.map(slug).join("/"); toast(`Deleted <b>${esc(r.short)}</b>`, { action: "Undo", onAction: () => { S.deleted.delete(id); rerender(); } }); },
    rulesave: saveRule,
    addsource: () => { const p = openLayer(`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Add source"><div class="grab"></div><div class="dh"><b style="font-weight:600">Add source</b><span class="sp"></span><button class="iconbtn" data-close aria-label="Close">${ic("x")}</button></div><div class="db"><div class="field"><label>Type</label><div class="seg"><button aria-pressed="true">M3U + XMLTV</button><button aria-pressed="false">Xtream Codes</button><button aria-pressed="false">HDHomeRun</button></div></div><div class="field"><label for="as1">Name</label><input class="inp" id="as1" placeholder="Living room antenna" autofocus></div><div class="field"><label for="as2">Playlist address</label><input class="inp mono" id="as2" placeholder="http://…/playlist.m3u"></div><div class="field"><label for="as3">Guide address (XMLTV)</label><input class="inp mono" id="as3" placeholder="http://…/epg.xml"></div><div class="field"><label for="as4">Streams at once</label><input class="inp mono" id="as4" placeholder="Unlimited"><span class="hint">Your provider's limit. Recordings get priority over live viewing.</span></div></div><div class="df"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close data-act="toast:addsrc">Test & add</button></div></aside>`, "drawer"); p.addEventListener("click", ev => { if (ev.target.closest("[data-close]")) closeLayer(); }); trapFocus(p); },
    testsrc: () => busy(a, "Testing…", () => toast("tvproxy: 142 channels, guide for 7 days, test stream plays directly.")),
    testsrc2: () => busy(a, "Testing…", () => toast("Zattoo Proxy: still HTTP 403 Forbidden. Try a different user agent.", { err: true })),
    refreshsrc: () => busy(a, "Refreshing…", () => { const r = $('[data-k="srcref"]'); if (r) r.textContent = hm(now()); toast("Refreshed tvproxy: 142 channels, 3 guide changes."); }),
    testhw: () => busy(a, "Testing…", () => { $("#hwres").innerHTML = `<span class="green">✓ Passed</span> · H.264 1080p50 at 212 fps, HEVC at 168 fps · CQP rate control`; }),
    demoempty: () => { S.demoEmpty = !S.demoEmpty; rerender(true); toast(S.demoEmpty ? "Showing empty states everywhere" : "Data is back", { icon: "info" }); },
    demoerror: () => { S.demoError = !S.demoError; rerender(true); toast(S.demoError ? "Player will show a stream error. Open any recording." : "Stream error cleared", { icon: "info" }); },
    dosignin: () => busy(a, "Signing in…", () => { location.hash = "#/"; toast("Signed in as Alex"); }, 700),
    setupnext: () => { AUTH.step = Math.min(3, AUTH.step + 1); rerender(); },
    setupskip: () => { AUTH.step = 3; rerender(); },
    setuptest: () => busy(a, "Testing…", () => { AUTH.srcTested = true; rerender(); }, 900),
    linkcheck: () => { AUTH.code = $$("#codebox input").map(i => i.value).join("").toUpperCase(); if (AUTH.code.length < 6) { toast("Enter all 6 characters.", { err: true }); return; } AUTH.link = "confirm"; rerender(); },
    linkok: () => busy(a, "Signing in…", () => { AUTH.link = "done"; rerender(); }, 600),
    linkno: () => { AUTH.link = "denied"; rerender(); },
    noop: () => {},
  };
  if (A[act]) { e.preventDefault(); A[act](); }
});
function busy(btn, label, done, ms = 1100) {
  const w = btn.offsetWidth; btn.style.width = w + "px"; const old = btn.innerHTML; btn.innerHTML = `<span class="spin"></span>`; btn.setAttribute("aria-busy", "true"); btn.title = label;
  setTimeout(() => { btn.innerHTML = old; btn.style.width = ""; btn.removeAttribute("aria-busy"); done(); }, ms);
}
document.addEventListener("input", e => {
  if (e.target.id === "libq") { S.lib.q = e.target.value; clearTimeout(e.target._t); e.target._t = setTimeout(() => { const pos = e.target.selectionStart; rerender(); const n = $("#libq"); n.focus(); n.setSelectionRange(pos, pos); }, 180); }
  if (e.target.id === "chq") { const q = e.target.value.toLowerCase(); $$("#chtbl tbody tr").forEach(tr => tr.style.display = tr.dataset.chname.includes(q) ? "" : "none"); }
  if (e.target.closest("#codebox")) { const i = +e.target.dataset.ci; e.target.value = e.target.value.toUpperCase(); if (e.target.value && i < 5) $(`#codebox [data-ci="${i + 1}"]`).focus(); }
});
document.addEventListener("keydown", e => { if (e.target.closest && e.target.closest("#codebox") && e.key === "Backspace" && !e.target.value) { const i = +e.target.dataset.ci; if (i > 0) $(`#codebox [data-ci="${i - 1}"]`).focus(); } }, true);
document.addEventListener("paste", e => { if (e.target.closest && e.target.closest("#codebox")) { const v = (e.clipboardData.getData("text") || "").replace(/[^a-z0-9]/gi, "").toUpperCase().slice(0, 6); if (v.length > 1) { e.preventDefault(); $$("#codebox input").forEach((inp, i) => inp.value = v[i] || ""); } } });

/* keyboard */
let gPending = 0;
document.addEventListener("keydown", e => {
  const typing = e.target.matches && e.target.matches("input, textarea, select, [contenteditable]");
  const { parts, top } = route();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if ($(".pal")) closeLayer(); else openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && top === "rules" && parts[1]) { e.preventDefault(); saveRule(); return; }
  if (e.key === "Escape") {
    if ($(".menu")) { $(".menu").remove(); return; }
    if ($("#layer").firstChild) { e.preventDefault(); closeLayer(); return; }
    if (PL && PL.fs) { plAct("fs"); return; }
    if (top === "watch") { $('[data-act="back"]').click(); return; }
    if (typing) { e.target.blur(); return; }
    return;
  }
  if ($("#layer").firstChild || typing || e.metaKey || e.ctrlKey || e.altKey) {
    if (!typing && e.key === "Enter" && $(".drawer [data-act=psave]") && document.activeElement.tagName !== "BUTTON" && document.activeElement.tagName !== "A") { e.preventDefault(); $(".drawer [data-act=psave]").click(); }
    return;
  }
  const k = e.key;
  if (gPending && Date.now() - gPending < 1200) {
    gPending = 0; const n = NAV.find(n => n.key === k.toUpperCase()); if (n) { e.preventDefault(); location.hash = n.href; return; }
  }
  if (top === "watch") {
    const map = { " ": "play", k: "play", K: "play", j: "back", l: "fwd", J: "back60", L: "fwd60", ArrowLeft: "back", ArrowRight: "fwd", Home: "start", End: "live", c: "catch", a: "audio", q: "quality", f: "fs", s: "speed" };
    let act = map[k]; if (e.shiftKey && (k === "ArrowLeft" || k === "ArrowRight")) act = k === "ArrowLeft" ? "back60" : "fwd60";
    if (act && !(document.activeElement && document.activeElement.matches("button") && k === " " && !document.activeElement.dataset.pl)) { e.preventDefault(); plAct(act); return; }
  }
  if (top === "guide") {
    if (guideKey(e)) return;
    if (k === "n") { guideScrollTo(now()); return; }
    if (k === "p") { guideScrollTo(at(0, "20:15")); return; }
    const f = document.activeElement; if (f && f.dataset && f.dataset.p) { if (k === "r") { location.hash = "#/guide/" + f.dataset.p; return; } if (k === "w") { location.hash = "#/watch/live-" + progById[f.dataset.p].ch; return; } }
    if (k === "ArrowDown" || k === "ArrowRight") { const first = [...$$(".gp.air")][0]; if (first && innerWidth >= 720) { e.preventDefault(); first.focus(); return; } }
  }
  if (top === "rules" && !parts[1] && k === "n") { location.hash = "#/rules/new"; return; }
  if (top === "home" && k === "Enter" && (document.activeElement === document.body || document.activeElement.id === "view")) { location.hash = "#/watch/live-skyf1"; return; }
  if (k === "g") { gPending = Date.now(); return; }
  if (k === "/") { e.preventDefault(); openPalette(); return; }
  if (k === "?") { openShortcuts(); return; }
});
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (route().top === "guide") { const g = $("#gwrap"); const sl = g && g.scrollLeft; rerender(true); } }, 200); });

/* =========================================================
   Boot
   ========================================================= */
$("#kbd-mod").textContent = MOD === "Ctrl" ? "Ctrl K" : "⌘K";
applyTheme();
if (!location.hash) history.replaceState(null, "", "#/");
(async () => {
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]); } catch {}
  render();
  requestAnimationFrame(() => document.documentElement.classList.remove("booting"));
})();
</script>
