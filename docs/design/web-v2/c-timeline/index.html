<!doctype html>
<!--
  SLIPSTREAM WEB v2 · Direction C, "Timeline"

  DIRECTION (5 sentences)
  1. Time is the organising axis: every screen is a view onto the same horizontal line, with the past on the left, the red "now" line, and the future on the right.
  2. Home is "Your day", one strip from 06:00 to 02:00 where recorded, recording and scheduled items sit in place; under it, editorial sections answer "what's on now, where was I, what's next, what's wrong".
  3. The guide, the player's channel panel, the rule forecast and the recording-gap view all reuse that model (veil over the past, red now line, amber "you"), so learning one screen teaches all of them.
  4. The behind-live idea is a single object, the Time Rail: the stretch between your playhead and the live edge is drawn as an amber band labelled with its length (−31:30), so being behind live is something you can see and close (From start · Catch up 1.25× · Live).
  5. Calm and editorial: warm paper and graphite neutrals, serif headlines, mono numerals for every time, colour only where it means something.

  TYPE & COLOUR
  - Instrument Serif (display: page titles, programme titles, big numbers in prose) · Geist (UI, 15 px base) · Geist Mono (every time, duration, count; tabular numerals).
  - Scale: 56/48/40 serif display · 30/26 serif section · 15/14/13 UI · 11-12 mono eyebrows (uppercase, +0.08em).
  - Neutrals: light = paper #F4F2ED / surface #FFF / ink #18160F; dark = graphite #0D0E10 / surface #141518 / paper text #EEEBE4. Hairlines are ink at 8-16 %.
  - Meaning: AMBER #FFC233 = you (playhead, your gap behind live, primary action, focus ring in dark; #8A5D00 for text and focus on light). RED = now / live / recording. ORANGE = needs attention (conflict, gap). GREEN = healthy. The player is always dark.

  LAYOUT GRID & BREAKPOINTS
  - Gutters 16 / 28 / 40 px (<760 / ≥760 / ≥1200), content max-width 1360 px; guide and player go full-bleed.
  - <760 phone: bottom tab bar (5 items), top bar with mark, now-clock, search, avatar; sheets slide up from the bottom; guide becomes "Now & next" or a vertical per-channel timeline.
  - 760-1099 tablet: top bar nav (icons-only below 900), one-column content, guide grid with compact channel column, player controls overlay the video.
  - ≥1100 desktop: Home is 1fr + 360/400 px aside; Library and Settings get a 240/220 px sticky side tree; the player gets a 360 px side panel (channel timeline + shortcuts).

  PROUDEST DECISIONS
  1. "Amber is you, red is now": two colours carry the whole product model, consistently across Home, Guide, Player, Rules and Problems.
  2. The gap behind live is a first-class visual object (amber band + length label), and "Catch up 1.25×" closes it with an ETA instead of forcing a jump.
  3. Your day on one axis: Home opens on a 20-hour strip of everything recorded, recording and scheduled, with the now line centred.
  4. Rule editor with a 14-day forecast axis and "similar, won't record" reasons (struck-through words, e.g. "contains Vorbericht"), so wrong-programme recordings are caught before saving.
  5. Zero-shift loading: skeletons are the real layout with text and art masked ([data-sk]), so loading → loaded never moves a pixel; the same trick makes Empty/Problem states reachable from the avatar menu.
-->

  --text:#EEEBE4; --text-2:#A6A298; --text-3:#6E6B63;
  --amber-ink:#FFC233; --amber-soft:rgba(255,194,51,.22); --amber-wash:rgba(255,194,51,.08);
  --live:#FF4A39; --live-ink:#FF6A5B; --live-soft:rgba(255,74,57,.13);
  --warn:#FF9C55; --warn-soft:rgba(255,156,85,.12);
  --ok:#52C98A; --ok-soft:rgba(82,201,138,.12);
  --focus:#FFC233;

  --veil:rgba(0,0,0,.22);

@media (min-width:760px){ :root{ --gut:28px; } }
@media (min-width:1200px){ :root{ --gut:40px; } }

/* ============ BASE ============ */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scrollbar-gutter:stable; }
html,body{ overflow-x:clip; }
body{ margin:0; background:var(--bg); color:var(--text); font:400 15px/1.45 var(--f-sans); -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11"; min-height:100dvh; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
a{ color:inherit; text-decoration:none; }
svg.i{ width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
svg.i.sm{ width:15px; height:15px; } svg.i.lg{ width:22px; height:22px; }
svg.i.fill{ fill:currentColor; stroke:none; }
:focus{ outline:none; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-1); }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.serif{ font-family:var(--f-serif); font-weight:400; letter-spacing:-.005em; }
.muted{ color:var(--text-2); } .faint{ color:var(--text-3); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.nowrap{ white-space:nowrap; } .ell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
kbd{ font:500 11px/1 var(--f-mono); padding:3px 5px; border-radius:5px; border:1px solid var(--line-2); border-bottom-width:2px; color:var(--text-2); background:var(--surface); min-width:20px; display:inline-block; text-align:center; }

/* ============ SHELL ============ */
.top{ position:sticky; top:0; z-index:40; height:var(--top); display:flex; align-items:center; gap:12px; padding:0 var(--gut); background:color-mix(in oklab, var(--bg) 84%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line); }
.brand{ display:flex; align-items:center; gap:9px; height:36px; padding-right:6px; border-radius:var(--r-2); flex:none; }
.brand svg{ height:26px; width:auto; }
.brand .wm{ height:15px; width:82px; }
.nav{ display:none; align-items:center; gap:2px; margin-left:12px; }
.nav a{ position:relative; display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:999px; color:var(--text-2); font-weight:500; font-size:14px; transition:color .15s, background .15s; }
.nav a:hover{ color:var(--text); background:var(--hover); }
.nav a[aria-current="page"]{ color:var(--text); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2); }
.nav .count{ font:500 11px/1 var(--f-mono); color:var(--warn); }
.top .spacer{ flex:1; }
.search-btn{ display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border-radius:999px; color:var(--text-2); border:1px solid var(--line-2); background:var(--surface); transition:border-color .15s, color .15s; }
.search-btn:hover{ color:var(--text); border-color:var(--line-3); }
.search-btn .lbl, .search-btn kbd{ display:none; }
.nowpill{ display:flex; align-items:center; gap:8px; height:36px; padding:0 12px 0 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line-2); font:500 13px/1 var(--f-mono); transition:border-color .15s; }
.nowpill:hover{ border-color:var(--live); }
.nowpill .d{ color:var(--text-3); display:none; }
.dot-live{ width:7px; height:7px; border-radius:50%; background:var(--live); box-shadow:0 0 0 0 var(--live); animation:pulse 2.4s infinite; flex:none; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 color-mix(in oklab, var(--live) 55%, transparent);} 70%{ box-shadow:0 0 0 7px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
.iconbtn{ width:36px; height:36px; display:grid; place-items:center; border-radius:999px; color:var(--text-2); transition:background .15s,color .15s; flex:none; }
.iconbtn:hover{ background:var(--hover); color:var(--text); }
.iconbtn:active{ background:var(--press); }
.avatar{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font:600 13px/1 var(--f-sans); background:linear-gradient(135deg,#3a3326,#1d1a14); color:#FFC233; flex:none; box-shadow:inset 0 0 0 1px rgba(255,194,51,.35); }
.avatar.b{ background:linear-gradient(135deg,#25343b,#141b1f); color:#9fd4e6; box-shadow:inset 0 0 0 1px rgba(159,212,230,.3); }
.avatar.c{ background:linear-gradient(135deg,#3b2533,#1f141b); color:#f0a6c8; box-shadow:inset 0 0 0 1px rgba(240,166,200,.3); }
.avatarbtn{ border-radius:50%; padding:2px; }
.tabbar{ position:fixed; inset:auto 0 0 0; z-index:40; height:calc(var(--tab) + env(safe-area-inset-bottom)); padding:0 6px env(safe-area-inset-bottom); display:grid; grid-template-columns:repeat(5,1fr); background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); }
.tabbar a{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:11px; font-weight:500; color:var(--text-3); position:relative; border-radius:12px; margin:6px 2px; }
.tabbar a svg{ width:22px; height:22px; }
.tabbar a[aria-current="page"]{ color:var(--text); }
.tabbar a[aria-current="page"]::before{ content:""; position:absolute; top:-7px; width:22px; height:2px; border-radius:2px; background:var(--amber); }
.tabbar .badge{ position:absolute; top:4px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--warn); color:#fff; font:600 10px/16px var(--f-mono); text-align:center; }
main#view{ display:block; padding-bottom:calc(var(--tab) + 40px + env(safe-area-inset-bottom)); min-height:calc(100dvh - var(--top)); }
@media (min-width:760px){
  .tabbar{ display:none; }
  .nav{ display:flex; }
  main#view{ padding-bottom:64px; }
  .nowpill .d{ display:inline; }
}
@media (max-width:759px){ .brand .wm{ display:none; } .top .theme-t{ display:none; } }
@media (min-width:1200px){
  .search-btn{ width:240px; padding:0 8px 0 12px; }
  .search-btn .lbl{ display:inline; flex:1; text-align:left; font-size:14px; }
  .search-btn kbd{ display:inline-block; }
}
@media (min-width:760px) and (max-width:899px){ .nav a span.t{ display:none; } .nav a{ padding:0 10px; } }
body.immersive .top, body.immersive .tabbar{ display:none; }
body.immersive main#view{ padding:0; min-height:100dvh; }
body.bare .top, body.bare .tabbar{ display:none; }
body.bare main#view{ padding:0; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 var(--gut); }
.wrap.narrow{ max-width:1080px; }

/* ============ TYPE BLOCKS ============ */
.pagehead{ padding:28px 0 20px; display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.pagehead h1{ margin:0; font:400 clamp(38px, 5vw, 56px)/1 var(--f-serif); letter-spacing:-.015em; }
.pagehead h1 em{ font-style:italic; color:var(--text-2); }
.pagehead .sub{ font:500 12px/1.4 var(--f-mono); color:var(--text-2); text-transform:uppercase; letter-spacing:.06em; margin-top:10px; }
.pagehead .actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
@media (min-width:760px){ .pagehead{ padding:40px 0 28px; } }
.eyebrow{ display:flex; align-items:center; gap:12px; font:500 11.5px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.09em; color:var(--text-2); margin:0 0 14px; }
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
.eyebrow .n{ color:var(--text-3); }
.eyebrow a{ text-transform:none; letter-spacing:0; font-family:var(--f-sans); font-size:13px; color:var(--text-2); order:3; display:flex; align-items:center; gap:2px; }
.eyebrow a:hover{ color:var(--text); }
.eyebrow.live{ color:var(--live-ink); }
.eyebrow.warn{ color:var(--warn); }
h2.t{ font:400 28px/1.1 var(--f-serif); margin:0; letter-spacing:-.01em; }
h3.t{ font:600 15px/1.3 var(--f-sans); margin:0; }

/* ============ BUTTONS ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 15px; border-radius:999px; font-weight:550; font-size:14px; white-space:nowrap; border:1px solid var(--line-2); background:var(--surface); color:var(--text); transition:background .15s, border-color .15s, transform .08s, box-shadow .15s; user-select:none; }
.btn:hover{ border-color:var(--line-3); background:var(--surface-2); }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--amber); color:var(--on-amber); border-color:transparent; box-shadow:0 1px 0 rgba(0,0,0,.08), inset 0 -1px 0 rgba(0,0,0,.08); }
.btn.primary:hover{ background:#FFCB4F; }
.btn.live{ background:var(--live); color:#fff; border-color:transparent; }
.btn.live:hover{ filter:brightness(1.07); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--text-2); }
.btn.ghost:hover{ background:var(--hover); color:var(--text); }
.btn.danger{ color:var(--live-ink); }
.btn.danger:hover{ background:var(--live-soft); border-color:transparent; }
.btn.sm{ height:32px; padding:0 12px; font-size:13px; gap:6px; }
.btn.lg{ height:46px; padding:0 20px; font-size:15px; }
.btn[disabled], .btn[aria-disabled="true"]{ opacity:.45; pointer-events:none; }
.btn .kb{ font:500 11px/1 var(--f-mono); opacity:.55; margin-left:2px; }
.btn.block{ width:100%; }
.linkbtn{ color:var(--amber-ink); font-weight:550; font-size:14px; border-radius:4px; }
.linkbtn:hover{ text-decoration:underline; text-underline-offset:3px; }

/* chips / badges */
.chip{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--line-2); font-size:13.5px; font-weight:500; color:var(--text-2); background:transparent; transition:all .15s; white-space:nowrap; }
.chip:hover{ color:var(--text); border-color:var(--line-3); }
.chip[aria-pressed="true"], .chip.on{ color:var(--text); background:var(--surface); border-color:var(--text); box-shadow:none; }
.chip .n{ font:500 11.5px/1 var(--f-mono); color:var(--text-3); }
.tag{ display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 7px; border-radius:5px; font:600 10.5px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
.tag.live{ background:var(--live); color:#fff; }
.tag.rec{ color:var(--live-ink); background:var(--live-soft); }
.tag.rec::before, .tag.live::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.tag.live::before{ background:#fff; animation:blink 1.6s infinite; }
@keyframes blink{ 50%{ opacity:.35; } }
.tag.sched{ color:var(--amber-ink); box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--amber-ink) 55%, transparent); }
.tag.ok{ color:var(--ok); background:var(--ok-soft); }
.tag.warn{ color:var(--warn); background:var(--warn-soft); }
.tag.neutral{ color:var(--text-2); background:var(--hover); box-shadow:inset 0 0 0 1px var(--line); }
.tag.new{ color:var(--on-amber); background:var(--amber); }

/* segmented */
.seg{ display:inline-flex; padding:3px; border-radius:999px; background:var(--bg-sunk); box-shadow:inset 0 0 0 1px var(--line); gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none; }
.seg::-webkit-scrollbar{ display:none; }
.seg button{ height:30px; padding:0 13px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--text-2); white-space:nowrap; transition:all .15s; display:inline-flex; align-items:center; gap:6px; }
.seg button:hover{ color:var(--text); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1), 0 0 0 1px var(--line-2); }
.seg button .n{ font:500 11px/1 var(--f-mono); color:var(--text-3); }
.seg button .n.w{ color:var(--warn); }

/* cards / surfaces */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-3); box-shadow:var(--shadow-1); }
.card.pad{ padding:20px; }
.hair{ height:1px; background:var(--line); border:0; margin:0; }

/* ============ SKELETON (geometry-preserving) ============ */
.is-loading [data-sk]{ color:transparent !important; background:var(--skel) !important; border-color:transparent !important; box-shadow:none !important; border-radius:6px; overflow:hidden; pointer-events:none; }
.is-loading [data-sk]:not(.cell):not(.tblock):not(.art){ position:relative; }
.is-loading [data-sk] *{ visibility:hidden; }
.is-loading [data-sk]::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, var(--skel-hi), transparent); transform:translateX(-100%); animation:shimmer 1.3s infinite; }
.is-loading [data-sk="art"]{ border-radius:var(--r-2); }
.is-loading [data-sk="round"]{ border-radius:999px; }
.is-loading .sk-hide{ visibility:hidden; }
@keyframes shimmer{ to{ transform:translateX(100%); } }
.fade-in{ animation:fadein .35s var(--ease) both; }
@keyframes fadein{ from{ opacity:0; } }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* ============ ART ============ */
.art{ position:relative; aspect-ratio:16/9; border-radius:var(--r-2); overflow:hidden; isolation:isolate; background:#15161a; color:#fff; flex:none; }
.art::before{ content:""; position:absolute; inset:0; z-index:-1; background:var(--g); }
.art::after{ content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55)); }
.art .ch{ position:absolute; top:9px; left:10px; font:600 10px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
.art .w{ position:absolute; left:11px; right:10px; bottom:8px; font:400 italic 22px/1 var(--f-serif); letter-spacing:-.01em; text-shadow:0 1px 12px rgba(0,0,0,.4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.art.lg .w{ font-size:clamp(28px,4vw,44px); left:18px; bottom:14px; }
.art.lg .ch{ top:14px; left:18px; font-size:11px; }
.art .bar{ position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.2); }
.art .bar i{ display:block; height:100%; background:var(--amber); }
.art .state{ position:absolute; top:8px; right:8px; }
.a-f1{ --g: radial-gradient(90% 70% at 85% 105%, rgba(255,60,40,.55), transparent 60%), repeating-linear-gradient(112deg, transparent 0 26px, rgba(255,255,255,.05) 26px 27px), linear-gradient(155deg,#2b1012,#0d0d10 70%); }
.a-f1b{ --g: radial-gradient(80% 70% at 15% 0%, rgba(255,194,51,.35), transparent 60%), repeating-linear-gradient(112deg, transparent 0 26px, rgba(255,255,255,.05) 26px 27px), linear-gradient(200deg,#1d1416,#0b0b0d 70%); }
.a-crime{ --g: radial-gradient(70% 90% at 75% 30%, rgba(90,150,170,.45), transparent 60%), linear-gradient(160deg,#0f2026,#07090b 75%); }
.a-news{ --g: radial-gradient(90% 90% at 20% 10%, rgba(70,110,200,.55), transparent 60%), linear-gradient(150deg,#101a33,#07080c 75%); }
.a-doc{ --g: radial-gradient(90% 80% at 70% 20%, rgba(214,170,90,.55), transparent 60%), radial-gradient(70% 60% at 10% 100%, rgba(60,120,80,.6), transparent 60%), linear-gradient(160deg,#2a2414,#0c0d09); }
.a-film{ --g: radial-gradient(70% 80% at 60% 40%, rgba(190,120,60,.45), transparent 60%), linear-gradient(160deg,#21160e,#060504 75%); }
.a-kids{ --g: radial-gradient(70% 80% at 20% 20%, rgba(255,150,70,.75), transparent 60%), radial-gradient(70% 80% at 90% 90%, rgba(60,170,190,.7), transparent 60%), linear-gradient(160deg,#3a2a20,#132226); }
.a-culture{ --g: radial-gradient(80% 80% at 70% 30%, rgba(150,110,190,.5), transparent 60%), linear-gradient(160deg,#1c1626,#09080c 75%); }
.a-show{ --g: radial-gradient(80% 80% at 70% 30%, rgba(200,90,120,.45), transparent 60%), linear-gradient(160deg,#25141a,#09080a 75%); }
.a-file{ --g: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 8px, transparent 8px 16px), linear-gradient(160deg,#25262b,#111215); }

/* channel logo tile */
.logo{ width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font:700 11px/1 var(--f-sans); letter-spacing:-.02em; color:#fff; flex:none; background:var(--c, #333); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
.logo.sm{ width:28px; height:28px; border-radius:7px; font-size:9.5px; }
.logo.xs{ width:22px; height:22px; border-radius:6px; font-size:8px; }

/* ============ TIME RAIL (core) ============ */
.rail-wrap{ --h:8px; position:relative; padding:22px 0 22px; user-select:none; touch-action:none; }
.rail{ position:relative; height:var(--h); border-radius:var(--h); background:transparent; cursor:pointer; }
.rail .seg-future{ position:absolute; top:50%; height:2px; transform:translateY(-50%); background-image:linear-gradient(90deg, var(--line-3) 0 3px, transparent 3px 7px); background-size:7px 2px; }
.rail .seg-nocap{ position:absolute; top:0; bottom:0; border-radius:var(--h) 0 0 var(--h); background:var(--hatch); box-shadow:inset 0 0 0 1px var(--line); }
.rail .seg-buf{ position:absolute; top:0; bottom:0; background:color-mix(in oklab, var(--text) 26%, transparent); }
.rail .seg-gap{ position:absolute; top:-3px; bottom:-3px; border-radius:4px; background:var(--amber-soft); box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--amber) 70%, transparent); }
.rail .seg-played{ position:absolute; top:0; bottom:0; background:var(--text); opacity:.82; border-radius:var(--h) 0 0 var(--h); }
.rail .seg-hole{ position:absolute; top:-3px; bottom:-3px; background:repeating-linear-gradient(135deg, var(--warn) 0 2px, transparent 2px 5px); border-radius:3px; box-shadow:inset 0 0 0 1px var(--warn); }
.rail .mk{ position:absolute; top:-7px; bottom:-7px; width:1px; background:var(--line-3); }
.rail .mk span{ position:absolute; top:-15px; left:4px; font:500 10.5px/1 var(--f-mono); color:var(--text-3); white-space:nowrap; }
.rail .edge{ position:absolute; top:-9px; bottom:-9px; width:2px; margin-left:-1px; background:var(--live); border-radius:2px; }
.rail .edge::after{ content:""; position:absolute; top:-4px; left:-3px; width:8px; height:8px; border-radius:50%; background:var(--live); animation:pulse 2.4s infinite; }
.rail .head{ position:absolute; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px color-mix(in oklab, var(--bg) 70%, transparent), 0 2px 8px rgba(0,0,0,.3); transition:transform .12s; }
.rail:hover .head, .rail.drag .head{ transform:scale(1.15); }
.rail .hover-t{ position:absolute; bottom:calc(100% + 14px); transform:translateX(-50%); padding:5px 8px; border-radius:6px; background:var(--text); color:var(--bg); font:500 11.5px/1 var(--f-mono); white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .12s; }
.rail:hover .hover-t{ opacity:1; }
.rail-labels{ display:flex; justify-content:space-between; margin-top:12px; font:500 11px/1 var(--f-mono); color:var(--text-3); gap:8px; }
.rail-labels .lv{ color:var(--live-ink); }
.gaplabel{ position:absolute; top:50%; transform:translate(-50%,-50%); font:600 10px/1 var(--f-mono); color:var(--amber-ink); white-space:nowrap; pointer-events:none; letter-spacing:-.02em; }

/* readout */
.readout{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.readout .big{ font:500 34px/1 var(--f-mono); letter-spacing:-.04em; color:var(--amber-ink); font-variant-numeric:tabular-nums; }
.readout .big.atlive{ color:var(--live-ink); }
.readout .lbl{ font-size:14px; color:var(--text-2); }

/* ============ HOME ============ */
.today{ position:relative; margin:0 calc(var(--gut) * -1); padding:0 var(--gut); }
.today-scroll{ overflow-x:auto; overflow-y:hidden; scrollbar-width:none; overscroll-behavior-x:contain; border-top:1px solid var(--line); border-bottom:1px solid var(--line); scroll-snap-type:none; }
.today-scroll::-webkit-scrollbar{ display:none; }
.today-track{ position:relative; height:152px; }
.today .hour{ position:absolute; top:0; bottom:0; border-left:1px solid var(--line); }
.today .hour span{ position:absolute; top:10px; left:6px; font:500 10.5px/1 var(--f-mono); color:var(--text-3); }
.today .past{ position:absolute; top:0; bottom:0; left:0; background:var(--veil); }
.today .nowline{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--live); z-index:3; }
.today .nowline b{ position:absolute; top:6px; left:50%; transform:translateX(-50%); background:var(--live); color:#fff; font:600 10.5px/1 var(--f-mono); padding:4px 6px; border-radius:5px; }
.tblock{ position:absolute; height:38px; border-radius:8px; padding:0 9px; display:flex; flex-direction:column; justify-content:center; font-size:12.5px; line-height:1.2; overflow:hidden; background:var(--surface); border:1px solid var(--line-2); text-align:left; transition:border-color .15s, transform .12s; z-index:2; min-width:6px; }
.tblock:hover{ border-color:var(--line-3); z-index:4; }
.tblock b{ font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tblock small{ font:500 10.5px/1.2 var(--f-mono); color:var(--text-3); white-space:nowrap; }
.tblock.rec{ border-color:color-mix(in oklab, var(--live) 60%, transparent); background:linear-gradient(90deg, var(--live-soft), var(--live-soft)) no-repeat, var(--surface); background-size:var(--done,0%) 100%, 100%; }
.tblock.sched{ border-style:dashed; border-color:color-mix(in oklab, var(--amber-ink) 60%, transparent); background:var(--amber-wash); }
.tblock.done{ background:var(--surface); }
.tblock.watched{ opacity:.6; }
.tblock.tiny{ overflow:visible; padding:0; }
.tblock.tiny b, .tblock.tiny small{ position:absolute; left:calc(100% + 6px); }
.tblock.tiny b{ top:4px; } .tblock.tiny small{ top:20px; }
.tblock.conflict{ border-color:var(--warn); border-style:solid; }
.today-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-3); }
.today-legend i{ display:inline-block; width:14px; height:8px; border-radius:3px; margin-right:6px; vertical-align:middle; border:1px solid var(--line-2); }
.today-legend .l-rec{ border-color:var(--live); background:var(--live-soft); }
.today-legend .l-sched{ border:1px dashed var(--amber-ink); background:var(--amber-wash); }

.home-grid{ display:grid; gap:40px 40px; grid-template-columns:minmax(0,1fr); margin-top:36px; }
@media (min-width:1100px){ .home-grid{ grid-template-columns:minmax(0,1fr) 360px; } .home-grid .span{ grid-column:1/-1; } }
@media (min-width:1440px){ .home-grid{ grid-template-columns:minmax(0,1fr) 400px; } }

.onnow{ display:grid; grid-template-columns:minmax(0,1fr); gap:0; overflow:hidden; }
.onnow .art{ border-radius:0; aspect-ratio:16/8; }
.onnow .body{ padding:20px 20px 18px; min-width:0; }
@media (min-width:760px){ .onnow{ grid-template-columns:minmax(0,5fr) minmax(0,7fr); } .onnow .art{ aspect-ratio:auto; min-height:100%; } .onnow .body{ padding:24px 28px 22px; } }
.onnow .meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--text-2); }
.onnow h2{ font:400 clamp(26px,3vw,34px)/1.08 var(--f-serif); margin:10px 0 4px; letter-spacing:-.01em; }
.onnow .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.alsonow{ display:grid; gap:8px; margin-top:12px; }
.alsonow a{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:var(--r-2); border:1px solid var(--line); background:var(--surface); }
.alsonow a:hover{ border-color:var(--line-2); }

.attn{ display:grid; gap:10px; }
.attn-item{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:14px 16px; border-radius:var(--r-3); background:var(--surface); border:1px solid var(--line); position:relative; }
.attn-item .ico{ grid-row:span 3; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--warn-soft); color:var(--warn); }
.attn-item.fail .ico{ background:var(--live-soft); color:var(--live-ink); }
.attn-item b{ font-weight:600; font-size:14px; }
.attn-item p{ margin:0; font-size:13.5px; color:var(--text-2); }
.attn-item .acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

.shelf{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px, 1fr); gap:16px; overflow-x:auto; scrollbar-width:none; scroll-snap-type:x mandatory; margin:0 calc(var(--gut) * -1); padding:0 var(--gut) 4px; scroll-padding:0 var(--gut); }
.shelf::-webkit-scrollbar{ display:none; }
.shelf > *{ scroll-snap-align:start; }
@media (max-width:759px){ .shelf{ grid-auto-columns:78%; } }
@media (min-width:1100px){ .shelf{ grid-auto-flow:row; grid-template-columns:repeat(4, minmax(0,1fr)); overflow:visible; margin:0; padding:0; } }
.tile{ display:block; border-radius:var(--r-3); min-width:0; }
.tile .art{ transition:transform .25s var(--ease), box-shadow .25s; }
.tile:hover .art{ transform:translateY(-2px); box-shadow:0 12px 30px -12px rgba(0,0,0,.45); }
.tile .tt{ margin-top:10px; font-weight:550; font-size:14.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
.tile .ts{ margin-top:3px; font:500 12px/1.3 var(--f-mono); color:var(--text-3); }

.agenda{ display:grid; }
.agenda .day{ font:500 11px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--text-3); padding:16px 0 8px; }
.agenda .day:first-child{ padding-top:0; }
.arow{ display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 8px; margin:0 -8px; border-radius:var(--r-2); text-align:left; width:calc(100% + 16px); }
.arow:hover{ background:var(--hover); }
.arow .tm{ font:500 13px/1 var(--f-mono); color:var(--text-2); }
.arow .ti{ font-weight:500; font-size:14px; line-height:1.3; }
.arow .su{ font-size:12.5px; color:var(--text-3); margin-top:2px; }
.arow.conf .tm{ color:var(--warn); }

/* ============ GUIDE ============ */
.gtool{ display:flex; align-items:center; gap:10px; padding:16px 0 14px; flex-wrap:wrap; }
.gtool h1{ font:400 40px/1 var(--f-serif); margin:0 12px 0 0; letter-spacing:-.015em; }
.days{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; max-width:100%; }
.days::-webkit-scrollbar{ display:none; }
.days button{ height:34px; padding:0 12px; border-radius:999px; font-size:13.5px; font-weight:500; color:var(--text-2); display:flex; gap:6px; align-items:center; white-space:nowrap; }
.days button:hover{ background:var(--hover); color:var(--text); }
.days button[aria-pressed="true"]{ background:var(--text); color:var(--bg); }
.days button .d{ font:500 11.5px/1 var(--f-mono); opacity:.65; }
.guide-shell{ position:relative; border-top:1px solid var(--line); }
.guide{ position:relative; overflow:auto; height:calc(100dvh - var(--top) - 76px); overscroll-behavior:contain; scrollbar-width:thin; }
.guide-inner{ position:relative; }
.g-head{ position:sticky; top:0; z-index:6; height:40px; display:flex; background:var(--bg); border-bottom:1px solid var(--line); }
.g-corner{ position:sticky; left:0; z-index:7; flex:none; width:var(--chw); background:var(--bg); border-right:1px solid var(--line); display:flex; align-items:center; padding-left:var(--gut); font:500 11px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--text-3); }
.g-times{ position:relative; flex:none; }
.g-times span{ position:absolute; top:0; height:40px; display:flex; align-items:center; padding-left:8px; border-left:1px solid var(--line); font:500 12px/1 var(--f-mono); color:var(--text-2); }
.g-times span.half{ color:var(--text-3); border-left-style:dotted; }
.g-row{ display:flex; height:68px; border-bottom:1px solid var(--line); }
.g-ch{ position:sticky; left:0; z-index:4; flex:none; width:var(--chw); display:flex; align-items:center; gap:12px; padding:0 12px 0 var(--gut); background:var(--bg); border-right:1px solid var(--line); text-align:left; }
.g-ch:hover{ background:var(--surface-2); }
.g-ch .num{ font:500 11px/1 var(--f-mono); color:var(--text-3); width:16px; }
.g-ch .nm{ font-weight:550; font-size:14px; }
.g-ch .nn{ font-size:12px; color:var(--text-3); }
.g-cells{ position:relative; flex:none; }
.cell{ position:absolute; top:5px; bottom:5px; border-radius:9px; padding:9px 11px; text-align:left; overflow:clip; background:var(--surface); border:1px solid var(--line); transition:border-color .12s, background .12s; display:flex; flex-direction:column; gap:3px; }
.cell:hover{ border-color:var(--line-3); z-index:2; }
.cell .ti, .cell .tm{ will-change:transform; }
.cell .ti{ font-weight:550; font-size:13.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.cell .tm{ font:500 11px/1.1 var(--f-mono); color:var(--text-3); white-space:nowrap; overflow:hidden; }
.cell.past{ background:transparent; }
.cell.past .ti{ color:var(--text-2); font-weight:500; }
.cell.now{ background:var(--surface); border-color:var(--line-2); }
.cell.rec{ border-color:color-mix(in oklab, var(--live) 55%, transparent); }
.cell.sched{ border-color:color-mix(in oklab, var(--amber-ink) 55%, transparent); border-style:dashed; }
.cell.tiny{ padding:9px 4px; }
.cell.tiny .ti, .cell.tiny .tm{ font-size:0; }
.cell.off{ background:transparent; border:1px dashed var(--line); }
.cell.off .ti{ color:var(--text-3); font-weight:400; }
.cell .rd{ width:7px; height:7px; border-radius:50%; background:var(--live); flex:none; }
.cell .sd{ width:8px; height:8px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--amber-ink); flex:none; }
.cell .prog{ position:absolute; left:0; bottom:0; height:2px; background:var(--live); opacity:.75; }
.g-noguide{ position:absolute; top:5px; bottom:5px; left:8px; display:flex; align-items:center; gap:10px; color:var(--text-3); font-size:13px; }
.g-past{ position:absolute; top:40px; bottom:0; left:var(--chw); background:var(--veil); pointer-events:none; z-index:1; }
.g-now{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--live); z-index:5; pointer-events:none; }
.g-now b{ position:sticky; top:9px; display:block; transform:translateX(-50%); margin-left:1px; width:max-content; background:var(--live); color:#fff; font:600 11px/1 var(--f-mono); padding:5px 7px; border-radius:6px; z-index:8; }
.gjump{ position:absolute; right:var(--gut); bottom:20px; z-index:9; }
.g-cols{ --chw:220px; }
@media (max-width:1023px){ .g-cols{ --chw:168px; } }
@media (max-width:759px){ .g-cols{ --chw:76px; } .g-ch .nm, .g-ch .nn, .g-ch .num{ display:none; } .g-ch{ justify-content:center; padding:0; } }

/* phone guide: now & next list */
.nn-list{ display:grid; }
.nn-row{ display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:4px 14px; padding:14px 0; border-bottom:1px solid var(--line); text-align:left; width:100%; align-items:start; }
.nn-row:hover{ background:var(--hover); }
.nn-row .logo{ grid-row:span 3; margin-top:2px; }
.nn-row .ti{ font-weight:600; font-size:15px; line-height:1.3; min-width:0; }
.nn-row .chn{ font-size:12px; color:var(--text-3); display:flex; gap:8px; align-items:center; }
.nn-row .pbar{ height:3px; border-radius:3px; background:var(--line-2); overflow:hidden; margin-top:6px; }
.nn-row .pbar i{ display:block; height:100%; background:var(--text); }
.nn-row .pbar.rec i{ background:var(--live); }
.nn-row .nx{ font-size:12.5px; color:var(--text-2); margin-top:6px; grid-column:2/4; }
.nn-row .nx .mono{ color:var(--text-3); margin-right:6px; }
.nn-row .left{ font:500 11.5px/1 var(--f-mono); color:var(--text-3); align-self:center; white-space:nowrap; }
/* phone agenda per channel */
.chips-x{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 calc(var(--gut) * -1); padding:2px var(--gut) 12px; }
.chips-x::-webkit-scrollbar{ display:none; }
.chips-x .chip{ flex:none; padding-left:5px; }
.vt{ position:relative; display:grid; }
.vt-row{ display:grid; grid-template-columns:54px minmax(0,1fr); gap:12px; text-align:left; width:100%; padding:0; }
.vt-row .tm{ font:500 12.5px/1 var(--f-mono); color:var(--text-3); padding-top:15px; text-align:right; }
.vt-row .bx{ padding:12px 14px; border-left:2px solid var(--line-2); margin-left:-1px; min-height:48px; }
.vt-row:hover .bx{ background:var(--hover); }
.vt-row.past .bx .ti{ color:var(--text-2); }
.vt-row.now .bx{ border-left-color:var(--live); background:var(--surface); border-radius:0 var(--r-2) var(--r-2) 0; }
.vt-row.now .tm{ color:var(--live-ink); }
.vt-row .ti{ font-weight:550; font-size:14.5px; display:flex; align-items:center; gap:8px; }
.vt-row .su{ font-size:12.5px; color:var(--text-3); margin-top:2px; }
.vt-now{ display:grid; grid-template-columns:54px 1fr; gap:12px; align-items:center; margin:2px 0; }
.vt-now b{ font:600 11px/1 var(--f-mono); color:#fff; background:var(--live); padding:4px 5px; border-radius:5px; justify-self:end; }
.vt-now i{ height:2px; background:var(--live); margin-left:-13px; }

/* ============ SHEET / DRAWER ============ */
.scrim{ position:fixed; inset:0; z-index:60; background:var(--scrim); animation:fadein .2s both; }
.sheet{ position:fixed; z-index:61; background:var(--raised); box-shadow:var(--shadow-pop); display:flex; flex-direction:column; overflow:hidden; }

/* ============ PLAYER ============ */
.player{ position:relative; min-height:100dvh; background:#07080A; color:#EEEBE4; display:grid; grid-template-columns:minmax(0,1fr); --text:#EEEBE4; --text-2:#A6A298; --text-3:#77736b; --line:rgba(255,248,235,.08); --line-2:rgba(255,248,235,.14); --line-3:rgba(255,248,235,.26); --surface:#15161A; --surface-2:#1a1b1f; --raised:#1D1F23; --hover:rgba(255,248,235,.06); --bg:#07080A; --amber-ink:#FFC233; --live-ink:#FF6A5B; --live:#FF4A39; --hatch:repeating-linear-gradient(135deg, rgba(255,248,235,.16) 0 1.5px, transparent 1.5px 6px); --amber-soft:rgba(255,194,51,.24); --focus:#FFC233; --bg-sunk:#0c0d0f; color-scheme:dark; }

.setnav{ display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin:0 calc(var(--gut) * -1); padding:0 var(--gut); }

.setnav a{ display:flex; align-items:center; gap:10px; height:36px; padding:0 12px; border-radius:999px; font-size:14px; color:var(--text-2); white-space:nowrap; flex:none; }
.setnav a:hover{ background:var(--hover); color:var(--text); }

@media (min-width:1024px){ .setnav{ flex-direction:column; margin:0; padding:0; position:sticky; top:calc(var(--top) + 24px); align-self:start; } .setnav a{ border-radius:8px; } .setnav a[aria-current="true"]{ background:var(--surface); color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2); font-weight:550; } }

function railGeom(m) {
  const span = m.b - m.a, P = t => clamp((t - m.a) / span * 100, 0, 100);
  const end = m.live ?? m.b;
  return { P, end };
}
function railHTML(id, m) {
  return `<div class="rail-wrap" data-rail="${id}"><div class="rail" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="100">
    <div class="seg-nocap"></div><div class="seg-buf"></div><div class="seg-played"></div><div class="seg-future"></div>
    ${(m.holes || []).map(() => `<div class="seg-hole"></div>`).join("")}
    ${(m.marks || []).map(k => `<div class="mk"><span>${esc(k.label)}</span></div>`).join("")}
    <div class="seg-gap"></div><div class="gaplabel"></div><div class="edge"></div><div class="head"></div><div class="hover-t"></div>
  </div>${m.noLabels ? "" : `<div class="rail-labels"><span class="l"></span><span class="r"></span></div>`}</div>`;
}
function railUpdate(wrap, m) {
  if (!wrap) return; const { P, end } = railGeom(m), r = wrap.querySelector(".rail");
  const set = (sel, a, b) => { const e = r.querySelector(sel); if (!e) return; if (b <= a) { e.style.display = "none"; return; } e.style.display = ""; e.style.left = P(a) + "%"; e.style.width = (P(b) - P(a)) + "%"; };
  set(".seg-nocap", m.a, m.buf); set(".seg-buf", m.buf, end); set(".seg-played", m.buf, m.pos);
  if (m.live != null) { set(".seg-future", m.live, m.b); r.querySelector(".edge").style.display = ""; r.querySelector(".edge").style.left = P(m.live) + "%"; }
  else { r.querySelector(".seg-future").style.display = "none"; r.querySelector(".edge").style.display = "none"; }
  const g = m.live != null ? m.live - m.pos : 0, gapEl = r.querySelector(".seg-gap"), gl = r.querySelector(".gaplabel");
  if (m.live != null && g > .25) { set(".seg-gap", m.pos, m.live); gl.style.display = ""; gl.style.left = ((P(m.pos) + P(m.live)) / 2) + "%"; gl.textContent = ((P(m.live) - P(m.pos)) / 100 * r.clientWidth > 64 ? "−" + clockDelta(g) : ""); } else { gapEl.style.display = "none"; gl.style.display = "none"; }
  const h = r.querySelector(".head"); h.style.left = P(m.pos) + "%"; h.style.display = m.noHead ? "none" : "";
  $$(".seg-hole", r).forEach((e, i) => { const [a, b] = m.holes[i]; e.style.left = P(a) + "%"; e.style.width = Math.max(.6, P(b) - P(a)) + "%"; });
  $$(".mk", r).forEach((e, i) => { e.style.left = P(m.marks[i].t) + "%"; });
  r.setAttribute("aria-valuenow", Math.round(P(m.pos))); r.setAttribute("aria-valuetext", m.live != null ? (g > .05 ? clockDelta(g) + " behind live" : "At live") : hms(m.pos));
  const L = wrap.querySelector(".rail-labels"); if (L) { L.querySelector(".l").textContent = m.left || hm(m.a); L.querySelector(".r").innerHTML = m.right || hm(m.b); }
}
function railBind(wrap, getM, onSeek) {
  const r = wrap.querySelector(".rail"), tip = r.querySelector(".hover-t");
  const tAt = x => { const m = getM(), rc = r.getBoundingClientRect(); return m.a + clamp((x - rc.left) / rc.width, 0, 1) * (m.b - m.a); };
  const lim = t => { const m = getM(); return clamp(t, m.buf, m.live ?? m.b); };
  r.addEventListener("pointermove", e => { const m = getM(), t = lim(tAt(e.clientX)); const rc = r.getBoundingClientRect(); tip.style.left = clamp(e.clientX - rc.left, 30, rc.width - 30) + "px"; tip.textContent = hms(t) + (m.live != null ? "  ·  −" + clockDelta(m.live - t) : ""); });
  r.addEventListener("pointerdown", e => { r.setPointerCapture(e.pointerId); r.classList.add("drag"); onSeek(lim(tAt(e.clientX)), false); const mv = ev => onSeek(lim(tAt(ev.clientX)), false); const up = ev => { r.classList.remove("drag"); r.removeEventListener("pointermove", mv); r.removeEventListener("pointerup", up); onSeek(lim(tAt(ev.clientX)), true); }; r.addEventListener("pointermove", mv); r.addEventListener("pointerup", up); });
  r.addEventListener("keydown", e => { const m = getM(); let d = 0; if (e.key === "ArrowLeft") d = -10 / 60; if (e.key === "ArrowRight") d = 10 / 60; if (e.key === "PageDown") d = -1; if (e.key === "PageUp") d = 1; if (d) { e.preventDefault(); e.stopPropagation(); onSeek(lim(m.pos + (e.shiftKey ? d * 6 : d)), true); } });
}

}

function norm(s) { return s.toLowerCase(); }
function matchRule(rule, p) {
  const fails = [], hits = [];

  const t = norm(p.title);
  rule.conds.forEach((c, ci) => {
    const ws = c.words.filter(Boolean); if (!ws.length) return;
    if (c.kind === "starts") { const w = ws.find(w => t.startsWith(norm(w))); w ? hits.push(w) : fails.push({ ci, why: `doesn't start with “${ws[0]}”` }); }
    if (c.kind === "contains") { const w = ws.filter(w => t.includes(norm(w))); w.length ? hits.push(...w) : fails.push({ ci, why: `has none of the ${ws.length} words` }); }
    if (c.kind === "exactly") { ws.some(w => t === norm(w)) ? hits.push(p.title) : fails.push({ ci, why: `isn't exactly “${ws[0]}”` }); }
    if (c.kind === "not") { const w = ws.find(w => t.includes(norm(w))); w ? fails.push({ ci, why: `contains “${w}”`, strike: w }) : null; }
    if (c.kind === "regex") { try { new RegExp(ws[0], "i").test(p.title) ? hits.push(p.title) : fails.push({ ci, why: "doesn't match the pattern" }); } catch (e) { fails.push({ ci, why: "pattern isn't valid" }); } }
  });

  if (rule.between) { const m = p.start % 1440; if (m < T(rule.between[0]) || m > T(rule.between[1])) fails.push({ why: `starts at ${hm(p.start)}, outside ${rule.between[0]}–${rule.between[1]}` }); }

}

function palRender(q) {

    const rs = REC.filter(r => norm(r.title + " " + (r.sub || "")).includes(ql)).slice(0, 6);
    if (rs.length) groups.push(["Recordings", rs.map(r => ({ label: r.title + (r.sub ? " · " + r.sub : ""), href: "#/library/rec/" + r.id, icon: "library", hint: dateShort(r.start) }))]);

  if (S.route.key === "watch" && S.player) {
    const k = e.key; const P = S.player;
    if (k === " " || k === "k") { e.preventDefault(); P.playing = !P.playing; return render(); }
    if (k === "j" || k === "J") { e.preventDefault(); return pSeek(P.pos - (e.shiftKey ? 1 : 10 / 60)); }
    if (k === "l" || k === "L") { e.preventDefault(); return pSeek(P.pos + (e.shiftKey ? 1 : 10 / 60)); }
    if (k === "ArrowLeft" && e.target.getAttribute("role") !== "slider") return pSeek(P.pos - 10 / 60);
    if (k === "ArrowRight" && e.target.getAttribute("role") !== "slider") return pSeek(P.pos + 10 / 60);
    if (k === "Home") { e.preventDefault(); return handleAct("p-start", null); }
    if (k === "End") { e.preventDefault(); return handleAct("p-live", null); }
    if (k === "c") return handleAct("p-catch", null);
    if (k === "a") return handleAct("p-menu", { dataset: { m: "audio" } });
    if (k === "q") return handleAct("p-menu", { dataset: { m: "quality" } });
    if (k === "f") return handleAct("p-fs", null);
  }
  if (e.key === "?") { e.preventDefault(); return shortcutsSheet(); }
  if (e.key === "/") { e.preventDefault(); return openPalette(); }
  if (gPending && Date.now() - gPending < 900) { const m = { h: "#/", g: "#/guide", l: "#/library", r: "#/rules", s: "#/settings" }[e.key]; gPending = 0; if (m) { location.hash = m; return; } }
  if (e.key === "g") { gPending = Date.now(); return; }
  if (e.key === "n") return handleAct("jumpnow", null);
});

/* ================= TICK ================= */
function tick() {
  const n = NOW();
  $$("[data-clock]").forEach(e => e.textContent = hm(n));
  playerAdvance(); playerTick();
  const ppmT = isNarrow() ? 1.4 : 1.9; const tn = $("[data-today-now]"); if (tn) { tn.style.left = (n - TS.a) * ppmT + "px"; $("[data-today-past]").style.width = (n - TS.a) * ppmT + "px"; }
  const gn = $("[data-gnow]"); if (gn) { const ppm = ppmGuide(); gn.style.left = `calc(var(--chw) + ${(n - G.a) * ppm}px)`; const gp = $("[data-gpast]"); if (gp && S.guideDay === 0) gp.style.width = (n - G.a) * ppm + "px"; }
  if (S.route && S.route.key === "now") recNow().forEach(r => { const w = $(`[data-rail="home-${r.id}"]`); if (w) railUpdate(w, recModel(r)); const d = $("[data-home-delta]"); if (d) d.textContent = "−" + clockDelta(n - r.pos); });
  const aw = $("[data-rail=auth]"); if (aw) railUpdate(aw, authModel());
  const dr = $("[data-rail=detail]"); if (dr && S.route.parts[2] && RECBY[S.route.parts[2]] && RECBY[S.route.parts[2]].state === "recording") { const r = RECBY[S.route.parts[2]]; railUpdate(dr, recModel(r, r.pos)); }
}
let bucket = "";
function bucketNow() { return isNarrow() ? "s" : innerWidth < 1024 ? "m" : "l"; }
addEventListener("resize", () => { const b = bucketNow(); if (b !== bucket) { bucket = b; if (S.route && !["rules"].includes(S.route.key)) render(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => updateShell(S.route && S.route.key));
addEventListener("hashchange", () => { closeSheet(); render(); if (S.route.key === "guide" && S.route.q.now) scrollGuideToNow(true); });

/* ================= BOOT ================= */
shell(); bucket = bucketNow(); render(); setInterval(tick, 1000);
</script>
</body>
