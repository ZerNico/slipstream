// What this device can decode and pass through, for the playback session (see
// MediaCapabilitiesModule.kt). A local Expo module: autolinking finds it in apps/app/modules.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.slipstream'
version = '0.1.0'

// The Media3 react-native-video plays with, so the passthrough answer is the one its audio
// sink gives (react-native-video reads the same `media3Version` override).
def media3Version = rootProject.ext.has('media3Version') ? rootProject.ext.get('media3Version') : '1.8.0'

android {
  namespace 'dev.slipstream.media'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:$media3Version"
}
